<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐷 AOM ADVENTURE — หมูอ้วงตามรัก</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#080b12;color:#fff;overflow-x:hidden}body{background:radial-gradient(circle at 50% -10%,#303b66,#090b12 60%)}button{font:inherit;cursor:pointer;border:0;color:#fff}.wrap{width:min(1100px,100%);margin:auto;padding:10px}.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#111725ee;border:1px solid #ffffff18;border-radius:18px;padding:10px;position:sticky;top:8px;z-index:20;backdrop-filter:blur(12px)}.brand{font-weight:900}.stats{display:flex;gap:6px;flex-wrap:wrap}.stat{background:#ffffff0a;border:1px solid #ffffff0d;border-radius:10px;padding:6px 9px;font-size:12px}.bar{height:6px;background:#ffffff12;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;width:0;background:#ffd83d}.screen{margin-top:10px;background:#101521;border:1px solid #ffffff14;border-radius:22px;padding:14px;min-height:680px}.title{font-size:clamp(25px,5vw,44px);margin:5px 0}.muted{color:#b9c1d1;line-height:1.55}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#ffd83d18;color:#ffe77a;font-weight:800;font-size:12px}.gamebox{position:relative;width:100%;max-width:920px;margin:12px auto 0}.canvasWrap{position:relative;border-radius:18px;overflow:hidden;border:2px solid #ffffff14;background:#06080c;box-shadow:0 18px 50px #0008}.canvasWrap canvas{display:block;width:100%;height:auto;image-rendering:auto;touch-action:none}.hint{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:8px 2px;color:#aeb7c8;font-size:13px}.toast{min-height:24px;color:#ffe27a;font-weight:700}.overlay{position:absolute;inset:0;background:#070a11cc;display:flex;align-items:center;justify-content:center;padding:18px}.panel{width:min(520px,94%);background:#151b2a;border:1px solid #ffffff20;border-radius:20px;padding:20px;text-align:center;box-shadow:0 25px 80px #000b}.panel h2{font-size:30px;margin:5px 0 10px}.choicegrid{display:grid;gap:9px;margin-top:14px}.choice{padding:13px 14px;background:#ffffff0b;border:1px solid #ffffff16;border-radius:13px;text-align:left}.choice:hover{background:#ffd83d15;border-color:#ffd83d55}.primary{background:#ffd83d;color:#111;font-weight:900;padding:12px 18px;border-radius:13px}.secondary{background:#ffffff0d;padding:12px 18px;border-radius:13px}.controls{display:none;position:absolute;left:12px;bottom:12px;right:12px;justify-content:space-between;pointer-events:none}.dpad{display:grid;grid-template-columns:46px 46px 46px;grid-template-rows:46px 46px 46px;gap:5px;pointer-events:auto}.dpad button,.action button{width:46px;height:46px;border-radius:13px;background:#111827cc;border:1px solid #ffffff22;font-size:20px;touch-action:none}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:3}.right{grid-column:3;grid-row:2}.action{display:flex;align-items:end;pointer-events:auto}.action button{width:64px;height:64px;border-radius:50%;background:#ffd83dcc;color:#111;font-weight:900}.mobileNote{display:none}@media(max-width:700px){.hud{grid-template-columns:1fr}.screen{min-height:calc(100vh - 100px);padding:9px}.controls{display:flex}.mobileNote{display:block}.stats{justify-content:center}.stat{font-size:11px;padding:5px 7px}.canvasWrap canvas{min-height:350px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hud"><div><div class="brand">🐷 AOM ADVENTURE</div><div class="bar"><i id="progress"></i></div></div><div class="stats"><div class="stat">❤️ <b id="love">0</b></div><div class="stat">😂 <b id="chaos">0</b></div><div class="stat">😤 <b id="sulk">0</b></div><div class="stat">🪙 <b id="coins">0</b></div><div class="stat">⭐ <b id="score">0</b></div></div></header>
<main class="screen" id="screen"></main>
</div>
<script>
'use strict';
const SAVE='aom-adventure-v1';
const base={world:0,level:0,love:0,chaos:0,sulk:0,coins:12,score:0,keys:0,secret:0,items:0};
let S=load(),keys={},raf=0,timers=[],cleanup=[];
function load(){try{return {...base,...JSON.parse(localStorage.getItem(SAVE)||'{}')}}catch(e){return {...base}}}
function save(){localStorage.setItem(SAVE,JSON.stringify(S));hud()}
function hud(){for(const k of ['love','chaos','sulk','coins','score']){const e=document.getElementById(k);if(e)e.textContent=S[k]}const p=document.getElementById('progress');if(p)p.style.width=Math.min(100,(S.world/6)*100)+'%'}
function clean(){cancelAnimationFrame(raf);timers.forEach(x=>clearTimeout(x));timers.forEach(x=>clearInterval(x));timers=[];cleanup.forEach(f=>{try{f()}catch(e){}});cleanup=[];keys={}}
function later(fn,n){const x=setTimeout(()=>{timers=timers.filter(t=>t!==x);fn()},n);timers.push(x)}
function on(el,ev,fn){el.addEventListener(ev,fn);cleanup.push(()=>el.removeEventListener(ev,fn))}
function add(o){for(const k of ['love','chaos','sulk','coins','score','keys','secret','items'])S[k]=Math.max(0,(S[k]||0)+(o[k]||0));save()}
function shell(tag,title,desc){return `<span class="tag">${tag}</span><h1 class="title">${title}</h1><p class="muted">${desc}</p><div id="content"></div>`}
const worlds=[
['WORLD 1','🏠 บ้าน','หนีออกจากบ้านก่อนหมูอ้วงจะจับได้'],
['WORLD 2','🌳 สวนหลังบ้าน','เก็บหัวใจและหาเส้นทางลับ'],
['WORLD 3','🏙️ เมืองของเรา','ทำภารกิจ หาเงิน และเปิดประตูเมือง'],
['WORLD 4','🌙 NIGHT RUN','คืนนี้หมูไม่ได้มาตัวเดียว...'],
['WORLD 5','🔐 SECRET LAB','ห้องลับที่ซ่อนเรื่องบางอย่างไว้'],
['WORLD 6','❤️ FINAL','ไปให้ถึงปลายทาง แล้วรู้ว่าทั้งหมดนี้สร้างขึ้นเพื่อใคร']
];
function render(){clean();hud();if(S.world>=6)return ending();const w=worlds[S.world];document.getElementById('screen').innerHTML=shell(w[0],w[1],w[2]);startWorld(S.world)}
function makeGame(content,tip){content.innerHTML=`<div class="gamebox"><div class="canvasWrap"><canvas id="c" width="900" height="520"></canvas><div class="controls"><div class="dpad"><button class="up" data-k="ArrowUp">▲</button><button class="left" data-k="ArrowLeft">◀</button><button class="down" data-k="ArrowDown">▼</button><button class="right" data-k="ArrowRight">▶</button></div><div class="action"><button data-k="Space">A</button></div></div></div><div class="hint"><span>${tip}</span><span class="mobileNote">มือถือ: ใช้ปุ่มบนจอ</span></div><div class="toast" id="toast"></div></div>`;return content.querySelector('#c')}
function bindControls(){document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;on(b,'pointerdown',e=>{e.preventDefault();keys[k]=true});on(b,'pointerup',e=>{e.preventDefault();keys[k]=false});on(b,'pointerleave',()=>keys[k]=false)});on(window,'keydown',e=>{keys[e.code]=true;keys[e.key]=true});on(window,'keyup',e=>{keys[e.code]=false;keys[e.key]=false})}
function drawBase(ctx){ctx.fillStyle='#0b1018';ctx.fillRect(0,0,900,520);ctx.strokeStyle='#151f2f';ctx.lineWidth=1;for(let x=0;x<900;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,520);ctx.stroke()}for(let y=0;y<520;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}}
function text(ctx,t,x,y,size=22){ctx.font=`800 ${size}px system-ui`;ctx.fillStyle='#fff';ctx.fillText(t,x,y)}
function player(ctx,p){text(ctx,'🐷',p.x-17,p.y+14,34)}
function heart(ctx,x,y){text(ctx,'❤️',x-14,y+11,28)}
function coin(ctx,x,y){text(ctx,'🪙',x-13,y+10,26)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function move(p,spd,wall=[]){let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(dx&&dy){dx*=.707;dy*=.707}let nx=Math.max(25,Math.min(875,p.x+dx*spd)),ny=Math.max(30,Math.min(490,p.y+dy*spd));for(const r of wall){if(nx>r.x-18&&nx<r.x+r.w+18&&ny>r.y-18&&ny<r.y+r.h+18)return}p.x=nx;p.y=ny}
function wall(ctx,r){ctx.fillStyle='#263348';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='#41536e';ctx.strokeRect(r.x,r.y,r.w,r.h)}
function exit(ctx,x,y){text(ctx,'🚪',x-18,y+15,38)}
function win(title,desc,reward={}){const c=document.getElementById('content');c.innerHTML=`<div class="panel"><h2>${title}</h2><p class="muted">${desc}</p><button class="primary" id="next">ไปต่อ ➜</button></div>`;add(reward);on(c.querySelector('#next'),'click',()=>{S.world++;save();render()})}
function startWorld(w){if(w===0)world1();if(w===1)world2();if(w===2)world3();if(w===3)world4();if(w===4)world5();if(w===5)world6()}
function world1(){const c=makeGame(document.getElementById('content'),'WASD / ลูกศร เดิน • เก็บ 🔑 แล้วไป 🚪 • ระวังหมูอ้วง');bindControls();const ctx=c.getContext('2d'),p={x:80,y:440},enemy={x:760,y:80},walls=[{x:190,y:0,w:35,h:330},{x:370,y:190,w:35,h:330},{x:550,y:0,w:35,h:300},{x:720,y:230,w:35,h:290}],key={x:450,y:90},door={x:830,y:430};let got=false,over=false,t0=Date.now();function loop(){if(over)return;drawBase(ctx);walls.forEach(r=>wall(ctx,r));text(ctx,'🏠 ห้องนั่งเล่น',30,40,18);text(ctx,'🔑',key.x-12,key.y+10,28);exit(ctx,door.x,door.y);player(ctx,p);text(ctx,'😈',enemy.x-18,enemy.y+13,32);move(p,3.4,walls);if(!got&&dist(p,key)<30){got=true;add({keys:1,score:100,coins:2});document.getElementById('toast').textContent='ได้กุญแจแล้ว! รีบไปประตู 🚪'}if(got){enemy.x+=(p.x-enemy.x)*.0018;enemy.y+=(p.y-enemy.y)*.0018}if(dist(p,enemy)<28){over=true;add({sulk:1,chaos:2});lose('โดนหมูจับ! 😂','หมูอ้วงกอดไว้แน่นจนไปต่อไม่ได้',()=>{world1()});return}if(got&&dist(p,door)<38){over=true;win('หนีออกมาได้! 🏠➡️','แต่หมูอ้วงยังตามมา...',{love:3,score:200,coins:3});return}if(Date.now()-t0>45000){over=true;lose('ช้าไป!','หมูอ้วงหาเจอแล้ว',()=>world1());return}raf=requestAnimationFrame(loop)}loop()}
function lose(t,d,retry){const c=document.getElementById('content');c.innerHTML=`<div class="panel"><h2>${t}</h2><p class="muted">${d}</p><button class="primary" id="retry">ลองใหม่</button></div>`;on(c.querySelector('#retry'),'click',retry)}
function world2(){const c=makeGame(document.getElementById('content'),'เก็บ ❤️ 8 ดวง แล้วหา 🌳 ประตูลับ • มีทางลัดซ่อนอยู่');bindControls();const ctx=c.getContext('2d'),p={x:70,y:450},walls=[{x:150,y:70,w:40,h:320},{x:300,y:0,w:40,h:290},{x:450,y:230,w:40,h:290},{x:600,y:50,w:40,h:300},{x:750,y:250,w:40,h:270}],items=Array.from({length:8},(_,i)=>({x:90+(i*103)%760,y:70+(i*71)%390,g:false}));let over=false;function loop(){if(over)return;drawBase(ctx);walls.forEach(r=>wall(ctx,r));text(ctx,'🌳',25,42,25);items.forEach(h=>{if(!h.g)heart(ctx,h.x,h.y)});text(ctx,'🌳',830,75,34);player(ctx,p);move(p,3.6,walls);items.forEach(h=>{if(!h.g&&dist(p,h)<30){h.g=true;add({love:1,score:80})}});if(items.every(h=>h.g)&&p.x>800&&p.y<120){over=true;win('เจอทางลับ! 🌿','หลังต้นไม้มีประตูที่ไม่น่าจะมีอยู่...', {love:5,coins:4,secret:1,score:300});return}raf=requestAnimationFrame(loop)}loop()}
function world3(){const c=makeGame(document.getElementById('content'),'เดินเก็บ 🪙 10 เหรียญ • เข้าใกล้ NPC เพื่อคุย • ซื้อกุญแจจากร้าน');bindControls();const ctx=c.getContext('2d'),p={x:80,y:440},walls=[{x:250,y:0,w:30,h:270},{x:250,y:350,w:30,h:170},{x:480,y:150,w:30,h:370},{x:700,y:0,w:30,h:300}],coins=Array.from({length:14},(_,i)=>({x:70+(i*127)%780,y:60+(i*83)%400,g:false}));let talk=false,have=false,over=false;function loop(){if(over)return;drawBase(ctx);walls.forEach(r=>wall(ctx,r));coins.forEach(q=>{if(!q.g)coin(ctx,q.x,q.y)});text(ctx,'🧑',400,75,34);text(ctx,'🏪',620,440,36);text(ctx,'🚪',830,80,38);player(ctx,p);move(p,3.5,walls);coins.forEach(q=>{if(!q.g&&dist(p,q)<28){q.g=true;add({coins:1,score:60})}});if(dist(p,{x:415,y:80})<50&&!talk){talk=true;document.getElementById('toast').textContent='NPC: “ถ้ามี 10 เหรียญ ฉันให้กุญแจได้”'}if(!have&&S.coins>=10&&dist(p,{x:650,y:430})<65){have=true;add({coins:-10,keys:1,score:180});document.getElementById('toast').textContent='ซื้อ 🔑 สำเร็จ! ไปประตู 🚪'}if(have&&dist(p,{x:830,y:80})<45){over=true;win('เมืองเปิดทางแล้ว 🏙️','ออมทิ้งข้อความไว้ว่า “อย่าลืมเก็บหัวใจด้วยนะ”',{love:5,score:350,secret:1});return}raf=requestAnimationFrame(loop)}loop()}
function world4(){const c=makeGame(document.getElementById('content'),'อยู่รอด 35 วินาที • เก็บ ❤️ • หลีกเลี่ยงหมู 😈 ที่ไล่เร็วขึ้นเรื่อย ๆ');bindControls();const ctx=c.getContext('2d'),p={x:450,y:260},enemies=[{x:80,y:80},{x:820,y:80},{x:80,y:450}],hearts=Array.from({length:10},(_,i)=>({x:60+(i*173)%800,y:70+(i*91)%400,g:false}));let over=false,start=Date.now(),spawn=0;function loop(){if(over)return;drawBase(ctx);text(ctx,'🌙 NIGHT RUN',30,40,20);hearts.forEach(h=>{if(!h.g)heart(ctx,h.x,h.y)});player(ctx,p);move(p,4.1);enemies.forEach((e,i)=>{const sp=.75+i*.08+(Date.now()-start)/90000;e.x+=(p.x-e.x)*sp*.008;e.y+=(p.y-e.y)*sp*.008;text(ctx,'😈',e.x-17,e.y+12,31);if(dist(p,e)<27){over=true;lose('โดนล้อมแล้ว! 😈','คราวนี้หมูอ้วงไม่ได้มาคนเดียว',()=>world4());return}});hearts.forEach(h=>{if(!h.g&&dist(p,h)<30){h.g=true;add({love:1,score:70})}});if(Date.now()-start>35000){over=true;win('รอดคืนอันตราย! 🌙','มีเสียงหัวเราะของออมดังมาจากประตูข้างหน้า...',{love:7,coins:6,score:500,secret:2});return}raf=requestAnimationFrame(loop)}loop()}
function world5(){const c=makeGame(document.getElementById('content'),'หาห้องลับ 3 จุด • กด A/Space ใกล้เครื่องหมาย ? • จำรหัสจากข้อความ');bindControls();const ctx=c.getContext('2d'),p={x:70,y:450},walls=[{x:180,y:80,w:35,h:330},{x:360,y:110,w:35,h:410},{x:540,y:0,w:35,h:330},{x:720,y:190,w:35,h:330}],spots=[{x:100,y:90,t:'A'},{x:450,y:70,t:'O'},{x:820,y:100,t:'M'}];let found=0,over=false;function loop(){if(over)return;drawBase(ctx);walls.forEach(r=>wall(ctx,r));spots.forEach(s=>{text(ctx,'?',s.x-10,s.y+10,30);text(ctx,s.t,s.x-6,s.y+35,13)});text(ctx,'🔐',820,440,38);player(ctx,p);move(p,3.4,walls);spots.forEach(s=>{if(dist(p,s)<42&&keys.Space){if(!s.f){s.f=true;found++;add({secret:2,score:150});document.getElementById('toast').textContent=`พบชิ้นส่วนรหัส ${found}/3`}}});if(found===3&&p.x>780&&p.y>390){over=true;document.getElementById('content').innerHTML=`<div class="panel"><h2>🔐 รหัสลับ</h2><p class="muted">รหัสที่ได้คือ <b>AOM</b><br>เลือกว่าหมูควรเปิดประตูนี้หรือไม่</p><div class="choicegrid"><button class="choice" id="yes">เปิดประตู 💗</button><button class="choice" id="no">แกล้งออม 😂</button></div></div>`;on(document.getElementById('yes'),'click',()=>{add({love:10,secret:4,score:500});S.world++;save();render()});on(document.getElementById('no'),'click',()=>{add({chaos:8,score:300});S.world++;save();render()});return}raf=requestAnimationFrame(loop)}loop()}
function world6(){const c=makeGame(document.getElementById('content'),'FINAL RUN • เก็บ ❤️ 12 ดวง • หนีหมู • ไปถึง ❤️ ตรงกลาง');bindControls();const ctx=c.getContext('2d'),p={x:70,y:450},boss={x:800,y:70},walls=[{x:170,y:0,w:40,h:350},{x:330,y:170,w:40,h:350},{x:490,y:0,w:40,h:350},{x:650,y:170,w:40,h:350}],hs=Array.from({length:12},(_,i)=>({x:80+(i*137)%760,y:65+(i*59)%410,g:false}));let over=false;function loop(){if(over)return;drawBase(ctx);walls.forEach(r=>wall(ctx,r));hs.forEach(h=>{if(!h.g)heart(ctx,h.x,h.y)});text(ctx,'💗',450,275,55);player(ctx,p);text(ctx,'👑🐷',boss.x-25,boss.y+15,34);move(p,4,walls);boss.x+=(p.x-boss.x)*.0025;boss.y+=(p.y-boss.y)*.0025;hs.forEach(h=>{if(!h.g&&dist(p,h)<30){h.g=true;add({love:2,score:100})}});if(dist(p,boss)<28){over=true;lose('หมูอ้วงจับได้ 😭','แต่คราวนี้หมูไม่จับ...หมูกอดแทน',()=>world6());return}if(hs.every(h=>h.g)&&dist(p,{x:450,y:275})<50){over=true;win('ไปถึงหัวใจแล้ว ❤️','ประตูสุดท้ายเปิดออก เรื่องทั้งหมดที่เจอไม่ใช่เรื่องบังเอิญ...',{love:12,score:1000,secret:5});return}raf=requestAnimationFrame(loop)}loop()}
function ending(){clean();hud();let title='💕 TOGETHER ENDING',msg='สุดท้ายออมก็หนีไม่พ้น... เพราะหมูอ้วงตั้งใจให้เกมนี้พาออมมาถึงตรงนี้ตั้งแต่แรก';if(S.secret>=8&&S.love>=28){title='🔐 SECRET TRUE LOVE';msg='ห้องลับเปิดออก และออมพบข้อความที่หมูซ่อนไว้ทุกโลก: “เกมนี้ไม่ได้สร้างมาให้ชนะ แต่สร้างมาเพื่อให้ออมรู้ว่าหมูรักออมแค่ไหน” ❤️'}else if(S.chaos>=18&&S.love<24){title='😂 CHAOS COUPLE';msg='ทั้งคู่หัวเราะจนลืมไปแล้วว่าใครชนะ สรุปคือความปั่นชนะทุกอย่าง'}else if(S.sulk>=4){title='😤 SULK ENDING';msg='ออมงอนอยู่พักใหญ่... แต่สุดท้ายก็ยิ้ม เพราะรู้ว่าหมูตั้งใจทำเกมนี้ให้'}else if(S.love>=32){title='❤️ TRUE LOVE';msg='ออมเดินกลับมาหาหมู และพูดสั้น ๆ ว่า “เกมนี้เราชอบที่สุดเลย”'}document.getElementById('screen').innerHTML=`<div class="panel" style="margin:60px auto"><div style="font-size:75px">🐷💗👩</div><h2>${title}</h2><p class="muted">${msg}</p><p>❤️ ${S.love} · 😂 ${S.chaos} · 😤 ${S.sulk} · 🪙 ${S.coins} · ⭐ ${S.score}</p><button class="primary" id="again">เล่นใหม่ตั้งแต่ต้น</button></div>`;on(document.getElementById('again'),'click',()=>{localStorage.removeItem(SAVE);S={...base};render()})}
hud();render();
</script>
</body>
</html>
