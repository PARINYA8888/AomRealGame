<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐷 หมู × 💗 ออม</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#7b3bbd 0,#241536 38%,#09070d 100%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{border:0;border-radius:16px;padding:13px 18px;background:#ff5c9a;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 22px #0005}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:900px;margin:auto;padding:14px}.top{position:sticky;top:0;z-index:5;background:#100b18ee;backdrop-filter:blur(12px);border:1px solid #ffffff18;border-radius:18px;padding:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#ffffff0d;border-radius:12px;padding:8px;text-align:center;font-size:13px}.bar{height:8px;background:#ffffff14;border-radius:99px;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff5c9a,#c56cff);width:0}.card{margin-top:14px;background:#ffffff0c;border:1px solid #ffffff16;border-radius:26px;padding:24px;min-height:570px;box-shadow:0 18px 55px #0005}.tag{display:inline-block;padding:6px 10px;border-radius:99px;background:#ff5c9a22;color:#ff9fc3;font-size:13px;font-weight:800}.title{font-size:clamp(27px,6vw,46px);line-height:1.12;margin:13px 0}.desc{color:#d8cfe0;line-height:1.7}.area{margin-top:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.choice{background:#ffffff0b;border:1px solid #ffffff18;text-align:left}.choice:hover{background:#ffffff17}.arena{position:relative;height:250px;background:#09070e;border-radius:20px;overflow:hidden;border:1px solid #ffffff14}.target{position:absolute;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#ff5c9a;font-size:28px;user-select:none;touch-action:none}.danger{position:absolute;font-size:30px}.pair{font-size:30px;padding:22px;background:#ffffff0b;border:1px solid #ffffff14}.selected{outline:3px solid #ff8bb6}.log{margin-top:14px;color:#bfb1c8;font-size:13px}.note{background:#ffffff08;border-radius:16px;padding:14px;margin-top:14px}.input{width:100%;padding:13px;border-radius:14px;border:1px solid #ffffff20;background:#0005;color:white}.bigbtn{width:100%;margin-top:10px}.center{text-align:center}.heart{position:fixed;pointer-events:none;animation:rise 2s ease-out forwards;z-index:10}@keyframes rise{to{transform:translateY(-180px) scale(1.7) rotate(25deg);opacity:0}}@media(max-width:560px){.card{padding:18px;min-height:600px}.stats{font-size:11px}.stat{padding:7px 3px}.arena{height:230px}}</style></head><body><div class="wrap"><div class="top"><div class="stats"><div class="stat">❤️ Love <b id="love">0</b></div><div class="stat">😂 Chaos <b id="chaos">0</b></div><div class="stat">😤 Sulk <b id="sulk">0</b></div><div class="stat">🪙 Coins <b id="coins">30</b></div></div><div class="bar"><i id="progress"></i></div></div><main class="card" id="app"></main></div><script>
'use strict';
const KEY='aom-real-game-v4';
const base={e:0,love:0,chaos:0,sulk:0,coins:30,memory:0,secret:0};
let S=load(),timers=[],cleanup=[];
function load(){try{return Object.assign({},base,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return {...base}}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function clearStage(){timers.forEach(clearTimeout);timers=[];cleanup.forEach(f=>{try{f()}catch{}});cleanup=[]}
function timer(f,ms){const id=setTimeout(()=>{timers=timers.filter(x=>x!==id);f()},ms);timers.push(id);return id}
function on(el,ev,fn){el.addEventListener(ev,fn);cleanup.push(()=>el.removeEventListener(ev,fn))}
function add(d={}){Object.assign(S,{love:S.love+(d.love||0),chaos:S.chaos+(d.chaos||0),sulk:S.sulk+(d.sulk||0),coins:Math.max(0,S.coins+(d.coins||0)),memory:S.memory+(d.memory||0),secret:S.secret+(d.secret||0)});save();ui()}
function ui(){document.querySelector('#love').textContent=S.love;document.querySelector('#chaos').textContent=S.chaos;document.querySelector('#sulk').textContent=S.sulk;document.querySelector('#coins').textContent=S.coins;document.querySelector('#progress').style.width=(S.e/30*100)+'%'}
function h(t){return `<span class="tag">ด่าน ${S.e+1}/30 · ${t}</span>`}
function go(){S.e++;save();render()}
function finish(d){add(d);go()}
function choice(items){return `<div class="grid">${items.map((x,i)=>`<button class="choice" data-c="${i}">${x[0]}</button>`).join('')}</div>`}
const stages=[
['หัวใจหนีหมู','catch',{}],['แชตแรก','chat',{}],['เลือกเดต','choice',[['🍜 ร้านก๋วยเตี๋ยว',2,1],['🌃 เดินเล่นกลางคืน',3,0],['🎮 ร้านเกม',1,3]]],['จับคู่ความทรงจำ','memory',{}],['กดให้ทัน','tap',{}],['ซื้อของให้แฟน','shop',{}],['หลบความวุ่นวาย','dodge',{}],['ออมงอน','sulkgame',{}],['คำถามความสัมพันธ์','quiz',{}],['หาไอเท็ม','find',{}],['ข้อความเวลา 23:59','timing',{}],['บริหารงบเดต','budget',{}],['ทางไหนไปเดต','route',{}],['วัดระดับความเขิน','blush',{}],['ปุ่มหลอกหมู','prank',{}],['Reaction','reaction',{}],['Memory รอบสอง','memory2',{}],['สะสมเหรียญ','coins',{}],['ปลดล็อกข้อความลับ','secret',{}],['ด่านหลบหัวใจ','dodge2',{}],['พูดอะไรดี','talk',{}],['เลือกของขวัญ','gift',{}],['ออมถามคำถาม','quiz2',{}],['เดินเก็บดาว','collect',{}],['เดตแบบสุ่ม','random',{}],['ง้อให้ทัน','apology',{}],['อนาคตของเรา','future',{}],['หัวใจหรือความปั่น','balance',{}],['กุญแจลับ','key',{}],['FINAL GAME','final',{}]
];
function render(){clearStage();ui();const app=document.querySelector('#app');if(S.e>=30)return ending();const [title,type,data]=stages[S.e];app.innerHTML=h(title)+`<h1 class="title">${title}</h1><p class="desc">${intro(type)}</p><div class="area" id="stage"></div><div class="log" id="log"></div>`;const el=document.querySelector('#stage');games[type](el,data)}
function intro(t){return ({catch:'จับหัวใจที่กำลังหนีให้ได้ก่อนหมดเวลา!',chat:'เลือกคำตอบที่ออมเห็นแล้วต้องยิ้ม',choice:'เลือกสถานที่ที่หมูกับออมจะไปเดต',memory:'เปิดการ์ดแล้วจับคู่ Emoji ให้ครบ',tap:'กดปุ่มให้ครบตามจังหวะก่อนเวลา',shop:'มีเงินจำกัด เลือกของที่อยากให้ออม',dodge:'ขยับตัวละครเพื่อหลบสิ่งที่ไม่ควรโดน',sulkgame:'ออมงอนแล้ว… ง้อให้ถูกวิธี',quiz:'ตอบคำถามเกี่ยวกับความสัมพันธ์',find:'หาไอเท็มลับที่ซ่อนอยู่',timing:'กดปุ่มให้ตรงช่วงเวลาที่หัวใจปรากฏ',budget:'บริหารเงินเดตให้เหลือกลับบ้าน',route:'เลือกเส้นทางเดตที่เหมาะกับวันนี้',blush:'รักษาแถบความเขินให้อยู่ในโซนที่ดี',prank:'มีปุ่มหนึ่งที่ไม่ควรกด… หรือควรกด?',reaction:'แตะเมื่อสัญลักษณ์ตรงกับคำสั่ง',memory2:'รอบนี้การ์ดเยอะขึ้น แต่รางวัลก็มากขึ้น',coins:'เก็บเหรียญให้ได้มากที่สุด',secret:'ทำเงื่อนไขให้ครบเพื่อเปิดข้อความลับ',dodge2:'รอบยากขึ้น: เก็บหัวใจและหลบระเบิด',talk:'เลือกประโยคที่หมุควรพูดกับออม',gift:'ของขวัญไหนตรงใจที่สุด?',quiz2:'คำถามกวน ๆ รอบสอง',collect:'เก็บดาวให้ครบก่อนเวลา',random:'สามเหตุการณ์สุ่ม หนึ่งทางพิเศษ',apology:'ง้อก่อนแถบงอนเต็ม',future:'เลือกภาพอนาคตที่อยากสร้างด้วยกัน',balance:'สมดุลความรักกับความปั่น',key:'หาเลขกุญแจจากเบาะแส',final:'เกมสุดท้าย: รวมทุกอย่างที่เรียนรู้มา'})[t]||'ทำภารกิจให้สำเร็จ!'}
const games={};
games.catch=(el)=>{el.innerHTML='<div class="arena" id="a"></div><button class="bigbtn" id="start">เริ่มจับหัวใจ</button>';const a=el.querySelector('#a');let hit=0,t0=Date.now(),active=true;function spawn(){if(!active)return;const b=document.createElement('div');b.className='target';b.textContent='❤️';b.style.left=Math.random()*82+'%';b.style.top=Math.random()*70+'%';a.append(b);on(b,'pointerdown',()=>{hit++;b.remove();if(hit>=8){active=false;finish({love:3,coins:5})}else spawn()})}on(el.querySelector('#start'),'click',()=>{el.querySelector('#start').disabled=true;spawn();const loop=()=>{if(!active)return;if(Date.now()-t0>12000){active=false;finish({chaos:2})}else timer(loop,100)}});};
games.chat=(el)=>{el.innerHTML=choice([['“คิดถึงนะ ❤️”',4,0],['“หิวไหม ไปกินกัน”',2,1],['“ว่างก็ทักมา”',0,3],['“หมุแกล้งเฉย ๆ 😂”',1,5]]);el.querySelectorAll('[data-c]').forEach((b,i)=>on(b,'click',()=>finish({love:[4,2,0,1][i],chaos:[0,1,3,5][i]})))};
games.choice=(el,items)=>{el.innerHTML=choice(items);el.querySelectorAll('[data-c]').forEach((b,i)=>on(b,'click',()=>finish({love:items[i][1],chaos:items[i][2],coins:-5})))};
function mem(el,n=4){const vals=['💗','🐷','🍜','🎮','🌙','🎁','✨','😂'].slice(0,n);let deck=[...vals,...vals].sort(()=>Math.random()-.5),first=null,lock=false,done=0;el.innerHTML='<div class="grid">'+deck.map((_,i)=>`<button class="pair" data-i="${i}">❓</button>`).join('')+'</div>';const bs=[...el.querySelectorAll('[data-i]')];on(el,'click',e=>{const b=e.target.closest('[data-i]');if(!b||lock||b.classList.contains('selected'))return;const i=+b.dataset.i;b.textContent=deck[i];b.classList.add('selected');if(first===null){first=i;return}lock=true;const a=first;first=null;if(deck[a]===deck[i]){done++;lock=false;if(done===n)finish({love:n,coins:n})}else timer(()=>{bs[a].textContent='❓';bs[i].textContent='❓';bs[a].classList.remove('selected');bs[i].classList.remove('selected');lock=false},500)})}
games.memory=(e)=>mem(e,4);games.memory2=(e)=>mem(e,5);
games.tap=(el)=>{el.innerHTML='<button class="bigbtn" id="tap">กดเมื่อขึ้น “ตอนนี้!”</button><div class="note" id="msg">เตรียมตัว...</div>';let n=0,goNow=false;const b=el.querySelector('#tap'),m=el.querySelector('#msg');const pulse=()=>{if(n>=7){finish({love:3,coins:5});return}goNow=true;m.textContent='ตอนนี้! ❤️';timer(()=>{if(goNow){goNow=false;m.textContent='พลาด!';n++;timer(pulse,500)}},650)};timer(pulse,900);on(b,'click',()=>{if(goNow){goNow=false;n++;m.textContent='โดน! '+n+'/7';timer(pulse,350)}else add({chaos:1})})};
games.shop=(el)=>{const items=[['🌹 ดอกไม้',12,4],['🍫 ช็อกโกแลต',8,3],['🧸 ตุ๊กตา',20,5],['🍟 ของกินที่ออมชอบ',10,5]];el.innerHTML='<p>เงินตอนนี้ 🪙 '+S.coins+'</p>'+choice(items);el.querySelectorAll('[data-c]').forEach((b,i)=>on(b,'click',()=>{if(S.coins<items[i][1]){b.textContent='เงินไม่พอ 😭';return}finish({coins:-items[i][1],love:items[i][2]})}))};
function dodge(el,hard=false){el.innerHTML='<div class="arena" id="a"><div id="p" style="position:absolute;bottom:10px;left:45%;font-size:35px">🐷</div></div><p>ลาก/แตะซ้ายขวาเพื่อหลบสิ่งกีดขวาง เก็บ ❤️ ให้ได้ 6 ดวง</p>';const a=el.querySelector('#a'),p=el.querySelector('#p');let x=45,score=0,dead=false;function move(clientX){x=Math.max(3,Math.min(90,clientX/a.getBoundingClientRect().width*100));p.style.left=x+'%'}on(a,'pointermove',e=>move(e.clientX));on(a,'pointerdown',e=>move(e.clientX));function spawn(){if(dead)return;const o=document.createElement('div');o.className='danger';o.textContent=Math.random()<.55?'❤️':'💣';o.style.left=Math.random()*92+'%';o.style.top='-35px';a.append(o);let y=-35;const step=()=>{if(dead)return;y+=hard?6:4;o.style.top=y+'px';const ox=parseFloat(o.style.left);if(y>180&&y<230&&Math.abs(ox-x)<9){if(o.textContent==='❤️'){score++;o.remove();if(score>=6){dead=true;finish({love:4,coins:6});return}}else{dead=true;finish({chaos:2,sulk:1});return}}if(y<260)timer(step,40);else o.remove()};step();timer(spawn,hard?350:500)}spawn()}
games.dodge=e=>dodge(e,false);games.dodge2=e=>dodge(e,true);
games.sulkgame=(el)=>{el.innerHTML=choice([['ขอโทษนะออม 🥺',5,-1],['โอ๋ ๆ ไม่งอนนะ',3,1],['งอนก็งอนไป 😂',0,6],['ซื้อของกินไปง้อ',4,0]]);el.querySelectorAll('[data-c]').forEach((b,i)=>on(b,'click',()=>finish({love:[5,3,0,4][i],chaos:[0,1,6,0][i],sulk:[0,0,4,0][i]})))};
function quiz(el,round=1){const qs=round===1?[['ออมชอบอะไรที่สุดในเดต?',['อยู่กับหมุ','นอน','ถูกทุกข้อ'],[4,1,2]],['ถ้าหมุเงียบควรทำยังไง?',['ถามว่าเป็นอะไร','ปล่อยไว้','ส่งมีม'],[4,1,3]],['คำตอบไหนหวานที่สุด?',['คิดถึงนะ','กินข้าวยัง','ทั้งสองอย่าง ❤️'],[3,2,5]]]:[['เวลาทะเลาะควรทำอะไร?',['คุยกัน','หายไป','แข่งกันเงียบ'],[5,1,0]],['ถ้าออมบอกหิว?',['ถามว่าอยากกินอะไร','ส่งเงินอย่างเดียว','ทำเป็นไม่เห็น'],[4,2,0]],['รักออมแค่ไหน?',['นิดเดียว','มาก','ที่สู๊ดดดด'],[1,4,6]]];let q=0,score=0;function ask(){if(q>=qs.length){finish({love:score,coins:score});return}const [t,ops,pts]=qs[q];el.innerHTML='<h2>'+t+'</h2>'+ops.map((x,i)=>`<button class="bigbtn" data-a="${i}">${x}</button>`).join('');el.querySelectorAll('[data-a]').forEach((b,i)=>on(b,'click',()=>{score+=pts[i];q++;ask()}))}ask()}
games.quiz=e=>quiz(e,1);games.quiz2=e=>quiz(e,2);
games.find=(el)=>{el.innerHTML='<div class="arena" id="a"></div><p>มีของซ่อนอยู่ 1 ชิ้น แตะหาให้เจอ!</p>';const a=el.querySelector('#a'),x=Math.random()*85,y=Math.random()*75;const hidden=document.createElement('button');hidden.textContent='🔐';hidden.style='position:absolute;left:'+x+'%;top:'+y+'%;opacity:.02';a.append(hidden);on(hidden,'click',()=>finish({love:5,secret:2,coins:8}));timer(()=>{hidden.style.opacity=.15},2500)};
games.timing=(el)=>{el.innerHTML='<div class="arena" id="a"></div><p id="m">รอหัวใจ...</p>';const a=el.querySelector('#a'),m=el.querySelector('#m');let live=false;timer(()=>{const b=document.createElement('button');b.className='target';b.textContent='❤️';b.style.left='45%';b.style.top='42%';a.append(b);live=true;on(b,'click',()=>{if(live){live=false;finish({love:5,coins:5})}});timer(()=>{if(live){live=false;finish({chaos:2})}},900)},1000)};
games.budget=(el)=>{let money=25;const plans=[['🍜 กินง่าย ๆ + เดินเล่น',12,5],['🍽️ ร้านดี + คาเฟ่',20,6],['💎 จัดเต็ม',30,9]];el.innerHTML='<p>งบเดต: 🪙 25</p>'+choice(plans);el.querySelectorAll('[data-c]').forEach((b,i)=>on(b,'click',()=>{if(plans[i][1]>money){b.textContent='งบแตก! 😂';finish({chaos:3});return}finish({coins:money-plans[i][1],love:plans[i][2]})}))};
games.route=(el)=>{el.innerHTML=choice([['🌳 ทางสวน — ชิล',4,0],['🌃 ทางเมือง — โรแมนติก',5,1],['🎢 ทางสวนสนุก — ปั่น',2,5],['🏠 ทางกลับบ้าน — เซฟ',2,0]]);el.querySelectorAll('[data-c]').forEach((b,i)=>on(b,'click',()=>finish({love:[4,5,2,2][i],chaos:[0,1,5,0][i]})))};
games.blush=(el)=>{el.innerHTML='<div class="arena"><div id="face" style="font-size:70px;text-align:center;padding-top:70px">😳</div></div><p>กดตอนแถบความเขินอยู่กลาง ๆ</p><button class="bigbtn" id="b">จับจังหวะ</button>';let v=50,dir=1;const f=el.querySelector('#face');const tick=()=>{v+=dir*4;if(v>95||v<5)dir*=-1;f.style.opacity=.5+v/200;timer(tick,80)};tick();on(el.querySelector('#b'),'click',()=>finish(Math.abs(v-60)<18?{love:6,secret:1}:{chaos:3,sulk:1}))};
games.prank=(el)=>{el.innerHTML='<p>มี 3 ปุ่ม หนึ่งปุ่มเป็นปุ่มหลอก 😈</p>'+choice([['💗 ปุ่มรัก',6,0],['😂 ปุ่มปั่น',0,6],['🔴 ปุ่มแดง',2,3]]);el.querySelectorAll('[data-c]').forEach((b,i)=>on(b,'click',()=>finish({love:[6,0,2][i],chaos:[0,6,3][i]})))};
games.reaction=(el)=>{let n=0;el.innerHTML='<div class="note" id="r">เตรียม...</div><button class="bigbtn" id="go">START</button>';const r=el.querySelector('#r'),b=el.querySelector('#go');on(b,'click',()=>{b.disabled=true;const loop=()=>{if(n>=8){finish({love:5,coins:7});return}const want=Math.random()<.5?'❤️':'😂';r.textContent='แตะเมื่อเห็น '+want;r.dataset.want=want;timer(()=>{if(r.dataset.want){n++;r.textContent='เร็วไป!';r.dataset.want='';timer(loop,250)}},700)};loop()});on(el,'click',e=>{if(e.target!==b&&r.dataset.want){n++;r.dataset.want='';r.textContent='เก่ง! '+n+'/8';timer(loop,150)}})};
games.coins=(el)=>{el.innerHTML='<div class="arena" id="a"></div><p>เก็บ 🪙 ให้ได้ 12 เหรียญใน 10 วินาที</p>';const a=el.querySelector('#a');let n=0;function spawn(){if(n>=12){finish({coins:12,chaos:1});return}const b=document.createElement('button');b.textContent='🪙';b.style='position:absolute;left:'+Math.random()*88+'%;top:'+Math.random()*75+'%';a.append(b);on(b,'click',()=>{n++;b.remove();spawn()})}spawn();timer(()=>finish({coins:n,chaos:n<8?2:0}),10000)};
games.secret=(el)=>{const ok=S.love>=15&&S.memory>=4;el.innerHTML=ok?'<div class="note">🔓 กุญแจลับถูกปลดล็อก!<br><br>“ถ้าออมกำลังอ่านอยู่… หมุแอบยิ้มอยู่แน่ ๆ” 💗</div><button class="bigbtn" id="b">เก็บความลับไว้กับเรา</button>':'<div class="note">🔒 ยังไม่ถึงเงื่อนไขลับ<br>ต้องมี Love ≥ 15 และชนะ Memory</div><button class="bigbtn" id="b">โอเค ไปต่อ</button>';on(el.querySelector('#b'),'click',()=>finish(ok?{secret:5,love:4}:{chaos:1}))};
games.talk=(el)=>{el.innerHTML=choice([['“วันนี้เหนื่อยไหม เดี๋ยวหมุอยู่ข้าง ๆ”',6,0],['“เออ ๆ ไม่เป็นไร”',0,3],['“ไปกินของอร่อยกัน เดี๋ยวหมุเลี้ยง”',4,1],['“คิดถึงจนจะบ้าแล้ว 😂”',3,5]]);el.querySelectorAll('[data-c]').forEach((b,i)=>on(b,'click',()=>finish({love:[6,0,4,3][i],chaos:[0,3,1,5][i]})))};
games.gift=(el)=>{el.innerHTML=choice([['💌 จดหมายเขียนเอง',7,0],['🎧 ของที่ใช้ได้ทุกวัน',5,1],['🍰 เค้กก้อนโต',4,3],['🧸 ตุ๊กตาหมู',6,2]]);el.querySelectorAll('[data-c]').forEach((b,i)=>on(b,'click',()=>finish({love:[7,5,4,6][i],chaos:[0,1,3,2][i]})))};
games.collect=(el)=>{el.innerHTML='<div class="arena" id="a"></div><p>เก็บ ⭐ 8 ดวง</p>';const a=el.querySelector('#a');let n=0;function s(){if(n>=8){finish({love:4,coins:8});return}const b=document.createElement('button');b.textContent='⭐';b.style='position:absolute;left:'+Math.random()*88+'%;top:'+Math.random()*78+'%';a.append(b);on(b,'click',()=>{n++;b.remove();s()})}s();timer(()=>finish({coins:n,chaos:n<8?2:0}),9000)};
games.random=(el)=>{const r=Math.floor(Math.random()*3);const a=[['🎡 ขึ้นชิงช้าสวรรค์','โรแมนติกบนฟ้า',6,0],['🍜 เจอร้านลับ','อร่อยเกินคาด',4,2],['🐷 หมูหลงทาง','ปั่นมาก 😂',2,6]][r];el.innerHTML='<div class="note">'+a[0]+'<br><br>'+a[1]+'</div><button class="bigbtn" id="b">ไปต่อ</button>';on(el.querySelector('#b'),'click',()=>finish({love:a[2],chaos:a[3],secret:r===0?1:0}))};
games.apology=(el)=>{el.innerHTML='<div class="arena"><div id="meter" style="position:absolute;left:5%;bottom:20px;height:24px;background:#ff5c9a;width:0;border-radius:99px"></div></div><button class="bigbtn" id="b">ง้อ! 🥺</button>';let v=0;const m=el.querySelector('#meter');on(el.querySelector('#b'),'click',()=>{v+=15;m.style.width=v+'%';if(v>=100)finish({love:7,coins:5});});timer(()=>{if(S.e<26)finish({sulk:5,chaos:2})},7000)};
games.future=(el)=>{el.innerHTML=choice([['🏠 บ้านเล็ก ๆ ของเรา',6,0],['✈️ เที่ยวด้วยกันเยอะ ๆ',5,1],['🐷💗 อยู่ข้างกันในวันที่ธรรมดา',8,0],['😂 ปั่นกันไปเรื่อย ๆ',3,6]]);el.querySelectorAll('[data-c]').forEach((b,i)=>on(b,'click',()=>finish({love:[6,5,8,3][i],chaos:[0,1,0,6][i],secret:i===2?2:0})))};
games.balance=(el)=>{el.innerHTML=choice([['❤️ รักล้วน ๆ',7,0],['😂 ปั่นล้วน ๆ',1,8],['💗 รัก 70% ปั่น 30%',7,3],['🐷 แล้วแต่ออม',5,5]]);el.querySelectorAll('[data-c]').forEach((b,i)=>on(b,'click',()=>finish({love:[7,1,7,5][i],chaos:[0,8,3,5][i]})))};
games.key=(el)=>{el.innerHTML='<p>เบาะแส: 2 + 4 + 0 + 1 = ?</p><input class="input" id="x" placeholder="ใส่เลข 1 หลัก"><button class="bigbtn" id="b">ไขกุญแจ 🔐</button>';on(el.querySelector('#b'),'click',()=>{const v=el.querySelector('#x').value.trim();finish(v==='7'?{love:6,secret:4,coins:7}:{chaos:4,sulk:1})})};
games.final=(el)=>{el.innerHTML='<div class="note center"><div style="font-size:65px">🐷💗</div><h2>FINAL GAME</h2><p>เลือกคำตอบที่เป็น “หมูกับออม” ที่สุด</p></div>'+choice([['❤️ รักกันและคุยกันทุกวัน',8,0],['😂 ปั่นกันจนแก่',5,7],['💕 อยู่ข้างกันแม้วันธรรมดา',10,0],['🔐 เลือกสิ่งที่หัวใจบอก',7,1]]);el.querySelectorAll('[data-c]').forEach((b,i)=>on(b,'click',()=>{add({love:[8,5,10,7][i],chaos:[0,7,0,1][i],secret:i===3?3:0});go()}))};
function ending(){clearStage();ui();let type;if(S.secret>=7&&S.love>=28)type='🔐 SECRET ENDING';else if(S.sulk>=7)type='😤 SULK ENDING';else if(S.chaos>=22&&S.love<25)type='😂 CHAOS COUPLE ENDING';else if(S.love>=32)type='❤️ TRUE LOVE ENDING';else type='💕 TOGETHER ENDING';const app=document.querySelector('#app');app.innerHTML='<div class="center"><div style="font-size:90px">🐷💗</div><span class="tag">THE END</span><h1 class="title">'+type+'</h1><p class="desc">เกมนี้หมุสร้างให้ออมโดยเฉพาะ 💗<br><br>Love '+S.love+' · Chaos '+S.chaos+' · Sulk '+S.sulk+' · Coins '+S.coins+'</p><div class="note">ขอบคุณที่เล่นจนจบนะออม<br><br><b style="font-size:25px">ต้าวหมูอ้วงรักออมที่สู๊ดดดด! ❤️</b><br><br>ไม่ว่า Ending ไหน หมุก็ดีใจที่ได้พบออม</div><button class="bigbtn" id="restart">เริ่มใหม่ 🔄</button></div>';on(app.querySelector('#restart'),'click',()=>{localStorage.removeItem(KEY);S={...base};render()})}
ui();render();
</script></body></html>
