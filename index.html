<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🐷 AOM ESCAPE — หนีหมูอ้วงให้รอด!</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b0811;color:#fff}body{background:radial-gradient(circle at 20% 0,#8e3ec0 0,#24142f 35%,#08070c 80%)}button{font:inherit;border:0;cursor:pointer}.app{width:min(980px,100%);margin:auto;padding:12px}.hud{position:sticky;top:8px;z-index:10;background:#100c18ee;backdrop-filter:blur(12px);border:1px solid #ffffff18;border-radius:18px;padding:10px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.stat{background:#ffffff0b;border-radius:11px;padding:7px 4px;text-align:center;font-size:12px}.bar{height:7px;background:#ffffff14;border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff4f91,#c35cff)}.screen{margin-top:12px;background:#ffffff09;border:1px solid #ffffff16;border-radius:26px;padding:18px;min-height:680px;box-shadow:0 20px 70px #0007}.title{font-size:clamp(28px,6vw,48px);line-height:1.05;margin:10px 0}.muted{color:#cfc2d5;line-height:1.65}.tag{display:inline-block;color:#ff9bc1;background:#ff5c9a18;border:1px solid #ff5c9a33;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}.row{display:flex;gap:9px;flex-wrap:wrap}.btn{background:#ff5c9a;color:#fff;border-radius:14px;padding:13px 18px;font-weight:850;box-shadow:0 8px 22px #0005}.btn.alt{background:#ffffff10;border:1px solid #ffffff18}.btn:disabled{opacity:.4;cursor:not-allowed}.arena{position:relative;height:390px;overflow:hidden;background:linear-gradient(#17101f,#09070d);border:1px solid #ffffff12;border-radius:20px;margin-top:15px;touch-action:none}.player{position:absolute;font-size:38px;user-select:none}.obj{position:absolute;user-select:none;touch-action:none}.coin{font-size:28px}.enemy{font-size:30px}.wall{position:absolute;background:#39224a;border:1px solid #ffffff12;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.cardbtn{height:82px;border-radius:14px;background:#ffffff0b;color:#fff;border:1px solid #ffffff15;font-size:30px}.cardbtn.open{background:#ff5c9a22}.choices{display:grid;gap:10px;margin-top:15px}.choice{padding:15px;text-align:left;border-radius:15px;background:#ffffff0b;color:#fff;border:1px solid #ffffff16}.choice b{display:block;margin-bottom:4px}.meter{height:18px;background:#ffffff12;border-radius:99px;overflow:hidden;margin:12px 0}.meter i{display:block;height:100%;width:50%;background:#ff5c9a}.toast{min-height:25px;margin-top:10px;color:#ffb1cc}.center{text-align:center}.bigemoji{font-size:80px}.final{font-size:clamp(34px,8vw,64px);color:#ff86ae}.danger{color:#ff9ebf}.kbd{background:#fff1;padding:2px 7px;border-radius:6px}@media(max-width:600px){.screen{min-height:calc(100vh - 100px);padding:14px}.arena{height:350px}.stats{font-size:10px}.stat{padding:6px 2px}.grid{gap:6px}.cardbtn{height:72px}.app{padding:8px}}
</style></head><body><div class="app"><header class="hud"><div class="stats"><div class="stat">❤️ Love<br><b id="love">0</b></div><div class="stat">😂 Chaos<br><b id="chaos">0</b></div><div class="stat">😤 Sulk<br><b id="sulk">0</b></div><div class="stat">🪙 Coins<br><b id="coins">20</b></div><div class="stat">🏆 Score<br><b id="score">0</b></div></div><div class="bar"><i id="prog"></i></div></header><main class="screen" id="game"></main></div><script>
'use strict';
const SAVE='aom-escape-save-v1';
const defaults={level:0,love:0,chaos:0,sulk:0,coins:20,score:0,secret:0};
let state=read(),timers=[],cleanups=[];
function read(){try{return Object.assign({},defaults,JSON.parse(localStorage.getItem(SAVE)||'{}'))}catch(e){return {...defaults}}}
function save(){localStorage.setItem(SAVE,JSON.stringify(state))}
function clearStage(){timers.forEach(clearTimeout);timers.forEach(clearInterval);timers=[];cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[]}
function later(fn,ms){const id=setTimeout(()=>{timers=timers.filter(x=>x!==id);fn()},ms);timers.push(id);return id}
function every(fn,ms){const id=setInterval(fn,ms);timers.push(id);return id}
function listen(el,ev,fn){el.addEventListener(ev,fn);cleanups.push(()=>el.removeEventListener(ev,fn))}
function add(x={}){state.love+=x.love||0;state.chaos+=x.chaos||0;state.sulk+=x.sulk||0;state.coins=Math.max(0,state.coins+(x.coins||0));state.score+=x.score||0;state.secret+=x.secret||0;save();hud()}
function hud(){document.querySelector('#love').textContent=state.love;document.querySelector('#chaos').textContent=state.chaos;document.querySelector('#sulk').textContent=state.sulk;document.querySelector('#coins').textContent=state.coins;document.querySelector('#score').textContent=state.score;document.querySelector('#prog').style.width=(Math.min(state.level,30)/30*100)+'%'}
function next(x={}){add(x);state.level++;save();render()}
function frame(tag,title,desc){return `<span class="tag">${tag} · ${state.level+1}/30</span><h1 class="title">${title}</h1><p class="muted">${desc}</p><div id="stage"></div><div class="toast" id="toast"></div>`}
function buttons(items){return '<div class="choices">'+items.map((x,i)=>`<button class="choice" data-choice="${i}"><b>${x[0]}</b>${x[1]||''}</button>`).join('')+'</div>'}
const levels=[
['หัวใจหนี!','catch','จับ ❤️ ให้ได้ 8 ดวงใน 12 วินาที'],['ทางเดินลึกลับ','maze','ลาก 🐷 ไปแตะ 🚪 โดยไม่ชนกำแพง'],['แชตกับออม','chat','เลือกข้อความที่หมุควรส่ง'],['Memory ห้องแรก','memory','จับคู่ Emoji ให้ครบ'],['หมูอ้วงตามมา!','chase','หลบ 💣 และเก็บ ❤️'],['ร้านของขวัญ','shop','เลือกของให้ออมด้วยงบจำกัด'],['กดให้ทัน','reaction','แตะตอนคำว่า NOW ปรากฏ'],['ออมงอนแล้ว','sulk','เลือกวิธีง้อที่ดีที่สุด'],['คำถามลับ','quiz','ตอบคำถามเพื่อเปิดทาง'],['ค้นหาห้อง','find','หา 🔑 ที่ซ่อนอยู่'],['ทางเลือกเดต','date','เลือกสถานที่และรับผลต่างกัน'],['งบเดต','budget','จัดงบให้เหลืออย่างน้อย 5 เหรียญ'],['หนีทางตัน','maze2','พา 🐷 ถึงประตูอีกครั้ง'],['วัดความเขิน','blush','กดให้ตัวชี้อยู่โซนหัวใจ'],['ปุ่มปั่น','prank','มีปุ่มหนึ่งที่ไม่ควรกด 😈'],['Reaction 2','reaction2','ทำคะแนน Reaction ให้ได้ 6 ครั้ง'],['Memory ห้องสอง','memory2','จับคู่ 5 คู่'],['เก็บเหรียญ','coins','เก็บเหรียญให้ได้ 12 เหรียญ'],['รหัสลับ','code','แก้รหัสจากเบาะแส'],['ไล่จับหัวใจ','catch2','จับหัวใจ 10 ดวง'],['พูดอะไรดี','talk','คำพูดหนึ่งประโยคจะเพิ่ม Love มากที่สุด'],['ของขวัญลับ','gift','เลือกของขวัญที่มีความหมาย'],['ออมถามตรง ๆ','quiz2','ตอบคำถามความสัมพันธ์'],['เดินเก็บดาว','stars','เก็บ ⭐ 10 ดวง'],['เหตุการณ์สุ่ม','random','เจอหนึ่งในสามเหตุการณ์'],['ง้อครั้งสุดท้าย','apology','เติมแถบง้อให้เต็มก่อนหมดเวลา'],['ภาพอนาคต','future','เลือกอนาคตที่อยากสร้าง'],['สมดุล','balance','ตัดสินใจระหว่างรักกับความปั่น'],['ประตูสุดท้าย','key','หาเลขกุญแจจากห้องก่อนหน้า'],['FINAL','final','เกมสุดท้าย: รวมทุกอย่างที่ออมเรียนรู้']];
function render(){clearStage();hud();if(state.level>=30)return ending();const [t,type,d]=levels[state.level];document.querySelector('#game').innerHTML=frame(t,type,d);games[type](document.querySelector('#stage'))}
const games={};
games.catch=(el)=>targetGame(el,8,12,false);games.catch2=(el)=>targetGame(el,10,14,false);
function targetGame(el,want,seconds){el.innerHTML='<div class="arena" id="a"></div><p class="muted">เวลา <b id="time">'+seconds+'</b>s · จับ <b id="count">0</b>/'+want+'</p>';const a=el.querySelector('#a'),c=el.querySelector('#count'),tm=el.querySelector('#time');let n=0,done=false;function spawn(){if(done)return;const b=document.createElement('button');b.className='obj';b.textContent=Math.random()<.18?'✨':'❤️';b.style.left=Math.random()*88+'%';b.style.top=Math.random()*82+'%';a.append(b);listen(b,'pointerdown',()=>{n++;c.textContent=n;b.remove();if(n>=want){done=true;next({love:4,coins:5,score:100})}else spawn()});later(()=>b.remove(),1200)}for(let i=0;i<2;i++)spawn();let left=seconds;const id=every(()=>{left--;tm.textContent=left;if(left<=0&&!done){done=true;next({chaos:2,score:n*5})}},1000)}
function maze(el){el.innerHTML='<div class="arena" id="a"><div class="player" id="p">🐷</div><div class="wall" style="left:25%;top:0;width:18%;height:65%"></div><div class="wall" style="left:58%;top:35%;width:18%;height:65%"></div><div class="wall" style="left:43%;top:70%;width:20%;height:10%"></div><div id="door" style="position:absolute;right:5%;top:8%;font-size:40px">🚪</div></div><p>ลาก 🐷 ไปที่ 🚪</p>';mazeLogic(el,false)}
games.maze=maze;games.maze2=(e)=>{mazeBase(e,true)};
function mazeBase(el,hard){el.innerHTML='<div class="arena" id="a"><div class="player" id="p">🐷</div><div class="wall" style="left:18%;top:20%;width:20%;height:10%"></div><div class="wall" style="left:48%;top:0;width:12%;height:55%"></div><div class="wall" style="left:70%;top:45%;width:18%;height:10%"></div><div class="wall" style="left:25%;top:60%;width:35%;height:10%"></div><div id="door" style="position:absolute;right:4%;bottom:7%;font-size:40px">🚪</div></div><p>ลาก 🐷 ผ่านเขาวงกตไป 🚪</p>';mazeLogic(el,hard)}
function mazeLogic(el,hard){const a=el.querySelector('#a'),p=el.querySelector('#p'),door=el.querySelector('#door');let x=5,y=75;function move(cx,cy){const r=a.getBoundingClientRect();x=Math.max(2,Math.min(92,cx/r.width*100-3));y=Math.max(2,Math.min(88,cy/r.height*100-5));p.style.left=x+'%';p.style.top=y+'%';if(x>84&&y<20){next({love:hard?5:4,coins:4,score:120})}}listen(a,'pointermove',e=>{if(e.buttons)move(e.clientX,e.clientY)});listen(a,'pointerdown',e=>move(e.clientX,e.clientY))}
games.chat=(el)=>choiceGame(el,[['💗 “คิดถึงนะออม”','หวานสุด',5,0],['🍜 “กินข้าวยัง”','ธรรมดา',2,1],['😂 “หิวก็ไปกินสิ”','ปั่น',0,5],['🥺 “วันนี้หมุอยากอยู่ข้าง ๆ”','อบอุ่น',6,0]]);
games.date=(el)=>choiceGame(el,[['🌃 เดินเล่นกลางคืน','โรแมนติก',5,1],['🍜 ร้านโปรด','ง่าย ๆ แต่มีความสุข',4,0],['🎢 สวนสนุก','ปั่นสุด',2,5],['🏠 อยู่บ้านดูหนัง','สบายใจ',6,0]]);
games.sulk=(el)=>choiceGame(el,[['🥺 ขอโทษนะออม','ยอมก่อน',6,0],['🍰 ซื้อขนมไปง้อ','มีของช่วย',5,0],['😂 งอนกลับ','ผิดหนักกว่าเดิม',0,6],['💗 ขอคุยกันดี ๆ','จริงใจ',7,0]]);
games.talk=(el)=>choiceGame(el,[['“หมุอาจกวน แต่หมุจริงจังกับออมนะ”','',7,1],['“ไม่ต้องคิดมาก”','',1,3],['“ไว้ค่อยคุย”','',0,2],['“หมุอยู่ตรงนี้นะ”','',8,0]]);
games.gift=(el)=>choiceGame(el,[['💌 จดหมายเขียนเอง','',8,0],['🧸 ตุ๊กตาหมู','',6,1],['🍫 ขนมที่ชอบ','',5,1],['🎧 ของใช้ทุกวัน','',5,0]]);
games.future=(el)=>choiceGame(el,[['🏠 บ้านเล็ก ๆ ของเรา','',7,0],['✈️ เที่ยวด้วยกัน','',6,1],['💕 อยู่ข้างกันในวันธรรมดา','',9,0],['😂 ปั่นกันจนแก่','',4,6]]);
games.balance=(el)=>choiceGame(el,[['❤️ รัก 100%','',8,0],['😂 ปั่น 100%','',1,9],['💗 รัก 70 / ปั่น 30','',7,3],['🐷 แล้วแต่ออม','',6,4]]);
function choiceGame(el,arr){el.innerHTML=buttons(arr);el.querySelectorAll('[data-choice]').forEach((b,i)=>listen(b,'click',()=>next({love:arr[i][2],chaos:arr[i][3],score:arr[i][2]*10})))}
games.memory=(el)=>memory(el,4);games.memory2=(el)=>memory(el,5);
function memory(el,pairs){const vals=['💗','🐷','🍜','🎮','🌙','🎁','⭐','😂'].slice(0,pairs),deck=[...vals,...vals].sort(()=>Math.random()-.5);el.innerHTML='<div class="grid">'+deck.map((_,i)=>`<button class="cardbtn" data-i="${i}">❓</button>`).join('')+'</div><p>จับคู่ให้ครบ</p>';const bs=[...el.querySelectorAll('[data-i]')];let first=null,lock=false,found=0;listen(el,'click',e=>{const b=e.target.closest('[data-i]');if(!b||lock||b.classList.contains('open'))return;const i=+b.dataset.i;b.textContent=deck[i];b.classList.add('open');if(first===null){first=i;return}lock=true;const a=first;first=null;if(deck[a]===deck[i]){found++;lock=false;if(found===pairs)next({love:pairs+2,coins:pairs,score:pairs*30})}else later(()=>{bs[a].textContent='❓';bs[i].textContent='❓';bs[a].classList.remove('open');bs[i].classList.remove('open');lock=false},500)})}
games.shop=(el)=>{const arr=[['🌹 ดอกไม้',12,5],['🍫 ช็อกโกแลต',7,3],['🧸 ตุ๊กตาหมู',16,6],['💌 จดหมาย',3,7]];el.innerHTML='<p>งบของหมู: 🪙 '+state.coins+'</p>'+arr.map((x,i)=>`<button class="choice" data-choice="${i}">${x[0]} · ${x[1]} coins · ❤️+${x[2]}</button>`).join('');el.querySelectorAll('[data-choice]').forEach((b,i)=>listen(b,'click',()=>{if(state.coins<arr[i][1]){document.querySelector('#toast').textContent='เงินไม่พอ! ลองเลือกอย่างอื่น';return}next({coins:-arr[i][1],love:arr[i][2],score:60})}))};
games.reaction=(el)=>reaction(el,5);games.reaction2=(el)=>reaction(el,6);
function reaction(el,want){el.innerHTML='<div class="note center" id="r">เตรียม...</div><button class="btn bigbtn" id="go">START</button><p>ต้องแตะเมื่อเห็น ❤️</p>';const r=el.querySelector('#r'),go=el.querySelector('#go');let n=0,live=false;function cycle(){if(n>=want){next({love:4,coins:5,score:100});return}live=false;r.textContent='รอ...';later(()=>{live=true;r.textContent='❤️ NOW!';later(()=>{if(live){live=false;cycle()}},650)},500+Math.random()*900)}listen(go,'click',()=>{go.disabled=true;cycle()});listen(el,'click',e=>{if(e.target===go)return;if(live){live=false;n++;r.textContent='ถูก! '+n+'/'+want;later(cycle,250)}else add({chaos:1})})}
games.quiz=(el)=>quiz(el,1);games.quiz2=(el)=>quiz(el,2);
function quiz(el,round){const qs=round===1?[['ถ้าออมงอน หมุควรทำอะไร?',['คุยกัน','หายไป','งอนกลับ'],[5,0,0]],['ของที่ดีที่สุดคืออะไร?',['ของแพง','ความใส่ใจ','อะไรก็ได้'],[1,6,3]],['หมุสร้างเกมนี้ให้ใคร?',['ออม','ตัวเอง','หมูอีกตัว'],[8,0,5]]]:[['วันธรรมดาที่ดีที่สุดคือ?',['มีออมอยู่ด้วย','มีเงินเยอะ','นอนทั้งวัน'],[7,1,2]],['คำไหนเหมาะกับเรา?',['หวาน','ปั่น','ทั้งสองอย่าง'],[4,5,8]],['สุดท้ายแล้วหมุอยากได้อะไร?',['ชนะเกม','หัวใจออม','เหรียญ'],[1,10,1]]];let q=0,total=0;function ask(){if(q===qs.length){next({love:total,score:total*15,secret:total>=18?3:0});return}const [t,op,pt]=qs[q];el.innerHTML='<h2>'+t+'</h2>'+op.map((x,i)=>`<button class="choice" data-a="${i}">${x}</button>`).join('');el.querySelectorAll('[data-a]').forEach((b,i)=>listen(b,'click',()=>{total+=pt[i];q++;ask()}))}ask()}
games.find=(el)=>{el.innerHTML='<div class="arena" id="a"></div><p>หา 🔑 ให้เจอภายใน 8 วินาที</p>';const a=el.querySelector('#a'),b=document.createElement('button');b.className='obj';b.textContent='🔑';b.style.left=Math.random()*88+'%';b.style.top=Math.random()*82+'%';a.append(b);listen(b,'click',()=>next({love:5,coins:6,secret:2,score:90}));later(()=>{if(b.isConnected)next({chaos:2,score:10})},8000)};
games.code=(el)=>{el.innerHTML='<div class="note">เบาะแส: ❤️=2 · 🐷=4 · ⭐=1<br><br>รหัสคือ ❤️ + 🐷 + ⭐</div><input class="input" id="x" placeholder="ใส่ 3 ตัวเลข" style="width:100%;padding:13px;border-radius:12px;background:#0006;color:#fff;border:1px solid #fff2"><button class="btn" id="b" style="margin-top:10px">เปิด 🔐</button>';listen(el.querySelector('#b'),'click',()=>next(el.querySelector('#x').value.trim()==='241'?{love:7,secret:4,score:100}:{chaos:3,sulk:1}))};
games.budget=(el)=>{const a=[['🍜 กินง่าย ๆ',12,5],['☕ คาเฟ่ + เดินเล่น',17,6],['🎡 จัดเต็ม',23,8]];el.innerHTML='<p>งบ 25 coins</p>'+buttons(a.map(x=>[x[0],'ใช้ '+x[1]+' coins',x[2],0]));el.querySelectorAll('[data-choice]').forEach((b,i)=>listen(b,'click',()=>next(a[i][1]<=20?{coins:25-a[i][1],love:a[i][2],score:80}:{chaos:3,score:20})))};
games.blush=(el)=>{el.innerHTML='<div class="meter"><i id="m"></i></div><button class="btn" id="b">หยุดเข็ม ❤️</button>';let v=0,d=1;const m=el.querySelector('#m');every(()=>{v+=d*7;if(v>=100||v<=0)d*=-1;m.style.width=v+'%'},80);listen(el.querySelector('#b'),'click',()=>next(Math.abs(v-70)<18?{love:7,secret:1,score:100}:{chaos:2,sulk:1,score:20}))};
games.prank=(el)=>choiceGame(el,[['💗 ปุ่มรัก','',6,0],['😂 ปุ่มปั่น','',0,7],['🔴 ปุ่มแดง','อย่ากด…',2,5]]);
games.coins=(el)=>coinGame(el,12,10);games.stars=(el)=>coinGame(el,10,9);
function coinGame(el,want,sec){const symbol=state.level===23?'⭐':'🪙';el.innerHTML='<div class="arena" id="a"></div><p>เก็บ '+symbol+' '+want+' ชิ้น · '+sec+'s</p>';const a=el.querySelector('#a');let n=0;function spawn(){if(n>=want){next({coins:want,love:3,score:100});return}const b=document.createElement('button');b.className='obj';b.textContent=symbol;b.style.left=Math.random()*88+'%';b.style.top=Math.random()*82+'%';a.append(b);listen(b,'click',()=>{n++;b.remove();spawn()})}spawn();every(()=>{if(!a.querySelector('.obj')&&n<want)spawn()},900);later(()=>next({coins:n,chaos:n<want?2:0,score:n*7}),sec*1000)}
games.random=(el)=>{const a=[['🌃 ชิงช้าสวรรค์','โรแมนติก',7,0,2],['🍜 ร้านลับ','อร่อยและปั่น',4,3,0],['🐷 หมูหลงทาง','วุ่นวาย 😂',2,7,0]][Math.floor(Math.random()*3)];el.innerHTML='<div class="bigemoji">'+a[0].slice(0,2)+'</div><h2>'+a[1]+'</h2><button class="btn" id="b">เล่นต่อ</button>';listen(el.querySelector('#b'),'click',()=>next({love:a[2],chaos:a[3],secret:a[4],score:80}))};
games.apology=(el)=>{el.innerHTML='<div class="meter"><i id="m" style="width:0"></i></div><button class="btn" id="b">ง้อ 🥺</button><p>กดให้เต็มก่อน 7 วินาที</p>';let v=0;const m=el.querySelector('#m');listen(el.querySelector('#b'),'click',()=>{v+=20;m.style.width=v+'%';if(v>=100)next({love:8,coins:4,score:120})});later(()=>{if(state.level===25)next({sulk:5,chaos:2,score:10})},7000)};
games.key=(el)=>{el.innerHTML='<div class="note">ห้องนี้จำรหัสจากเบาะแสเดิม<br>❤️=2 🐷=4 ⭐=1</div><input class="input" id="x" placeholder="รหัส 241"><button class="btn" id="b" style="margin-top:10px">เปิดประตู</button>';listen(el.querySelector('#b'),'click',()=>next(el.querySelector('#x').value==='241'?{love:8,secret:5,score:120}:{chaos:3,sulk:1}))};
games.final=(el)=>{el.innerHTML='<div class="center"><div class="bigemoji">🐷💗</div><h2>FINAL GAME</h2><p class="muted">เลือกสิ่งที่เป็น “หมูกับออม” ที่สุด</p>'+buttons([['❤️ รักกันในทุกวัน','',10,0],['😂 ปั่นกันจนแก่','',4,9],['💕 อยู่ข้างกันแม้วันธรรมดา','',12,0],['🔐 ตามเสียงหัวใจ','',9,1]])+'</div>';el.querySelectorAll('[data-choice]').forEach((b,i)=>listen(b,'click',()=>{add({love:[10,4,12,9][i],chaos:[0,9,0,1][i],secret:i===3?5:0,score:150});state.level=30;save();render()}))};
function ending(){clearStage();hud();let title;if(state.secret>=10&&state.love>=40)title='🔐 SECRET ENDING';else if(state.sulk>=6)title='😤 SULK ENDING';else if(state.chaos>=28&&state.love<32)title='😂 CHAOS COUPLE ENDING';else if(state.love>=42)title='❤️ TRUE LOVE ENDING';else title='💕 TOGETHER ENDING';document.querySelector('#game').innerHTML='<div class="center"><div class="bigemoji">🐷💗</div><span class="tag">THE END</span><h1 class="final">'+title+'</h1><p class="muted">หมูสร้างเกมนี้ให้ออมโดยเฉพาะ<br>และถ้าออมมาถึงตรงนี้… หมุขอสารภาพว่า</p><div class="note"><b style="font-size:25px">ต้าวหมูอ้วงรักออมที่สู๊ดดดด! ❤️</b><br><br>ดีใจที่ได้พบเธอ<br>ไม่ว่าจะวันไหน หมุก็อยากมีออมอยู่ในเรื่องราวของหมุ</div><p>Love '+state.love+' · Chaos '+state.chaos+' · Sulk '+state.sulk+' · Coins '+state.coins+'</p><button class="btn" id="restart">เล่นใหม่ 🔄</button></div>';listen(document.querySelector('#restart'),'click',()=>{localStorage.removeItem(SAVE);state={...defaults};render()})}
hud();render();
</script></body></html>
