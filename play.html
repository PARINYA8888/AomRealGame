<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐷 หมู × 💗 ออม</title><style>body{margin:0;background:#180b19;color:white;font-family:system-ui;text-align:center}main{max-width:520px;margin:auto;padding:12px}.stats{display:flex;gap:6px;position:sticky;top:0;background:#180b19;padding:8px}.s,.card{background:#ffffff12;border:1px solid #ffffff22;border-radius:18px}.s{flex:1;padding:9px;font-weight:bold}.card{padding:20px;margin-top:12px}.big{font-size:70px}.story{font-size:18px;line-height:1.6}.btn{display:block;width:100%;margin:9px 0;padding:15px;border:0;border-radius:15px;font-size:17px;font-weight:bold}.pink{background:#ff72a8;color:white}.arena{height:320px;background:#09070d;border-radius:15px;position:relative}.heart{position:absolute;font-size:44px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.timer{font-size:28px;font-weight:bold}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tile{height:65px;border:0;border-radius:12px;background:#ffffff18;color:white;font-size:25px}.open{background:#ff72a8}</style></head><body><main><div class="stats"><div class="s">❤️<b id="l">50</b></div><div class="s">😂<b id="c">0</b></div><div class="s">😤<b id="g">0</b></div><div class="s">ด่าน <b id="st">1</b>/10</div></div><div id="game"></div></main><script>
const S={n:0,l:50,c:0,g:0};let timers=[];const G=document.getElementById('game');const $=x=>document.getElementById(x);function stop(){timers.forEach(clearInterval);timers=[]}function add(k,v){S[k]=Math.max(0,S[k]+v);$('l').textContent=S.l;$('c').textContent=S.c;$('g').textContent=S.g}function card(t,h){stop();G.innerHTML='<section class="card"><h1>'+t+'</h1>'+h+'</section>';$('st').textContent=Math.min(S.n+1,10)}function B(t,f,cl=''){let b=document.createElement('button');b.className='btn '+cl;b.textContent=t;b.onclick=f;return b}function next(){S.n++;draw()}
function draw(){[intro,hunt,date,chat,memory,tap,prank,end][S.n]()}function intro(){card('🐷 หมู × 💗 ออม','<div class="big">🐷💗</div><p class="story">ภารกิจวันนี้คือพิสูจน์ว่าออมรู้ใจหมู และหมูรักออมแค่ไหน 😏<br><b>ห้ามโกงนะ!</b></p>');G.firstChild.append(B('เริ่มเกม ❤️',next,'pink'))}
function hunt(){let n=0,t=12;card('💗 ล่าหัวใจ','<p>แตะหัวใจ 6 ดวงให้ทัน!</p><div class="timer" id="tm">12</div><div class="arena" id="a"></div><p id="p">0/6</p>');let h=document.createElement('div');h.className='heart';h.textContent='💗';$('a').append(h);function move(){h.style.left=Math.random()*85+'%';h.style.top=Math.random()*82+'%'}h.onclick=()=>{n++;$('p').textContent=n+'/6';add('l',3);if(n>=6){next()}else move()};move();timers.push(setInterval(()=>{t--;if($('tm'))$('tm').textContent=t;if(t<=0){stop();add('c',5);card('หัวใจหนี 😂','<p class="story">หมูแอบหัวเราะแล้ว 555</p>');G.firstChild.append(B('ไปต่อ',next))}},1000))}
function date(){card('🗺️ เลือกเดต','<p class="story">วันนี้หมูให้ออมเลือกสถานที่</p>');[['🍜 ของอร่อย',8,1],['🎮 เกมด้วยกัน',4,8],['🌳 เดินเล่น',6,2],['🏠 ดูหนัง',7,0]].forEach(x=>G.firstChild.append(B(x[0],()=>{add('l',x[1]);add('c',x[2]);next()})))}
function chat(){let q=0;let qs=['คิดถึงหมูไหม?','วันนี้เหนื่อยไหม?','ถ้างอนต้องง้อยังไง?'];card('💬 แชตกับหมู','<div id="chat"></div>');function show(){let d=$('chat');d.innerHTML='<p class="story">ออม: '+qs[q]+'</p>';[['ตอบจริงใจ ❤️',6,0],['ตอบกวน 😂',2,5],['ตอบว่าไม่รู้ 😏',0,4]].forEach(x=>d.append(B(x[0],()=>{add('l',x[1]);add('c',x[2]);q++;if(q===3)next();else show()})))}show()}
function memory(){let v=['❤️','🐷','🍜','🎮','❤️','🐷','🍜','🎮'].sort(()=>Math.random()-.5),o=[],m=[];card('🧠 จำเรื่องของเรา','<p>จับคู่ให้ครบ 4 คู่</p><div class="cards" id="mg"></div>');function draw(){let g=$('mg');g.innerHTML='';v.forEach((x,i)=>{let b=B(o.includes(i)||m.includes(i)?x:'?',()=>flip(i));b.className='tile '+(o.includes(i)||m.includes(i)?'open':'');g.append(b)})}function flip(i){if(o.includes(i)||m.includes(i)||o.length>1)return;o.push(i);draw();if(o.length===2){if(v[o[0]]===v[o[1]]){m.push(...o);o=[];add('l',4);if(m.length===8)setTimeout(next,300);else draw()}else setTimeout(()=>{o=[];draw()},450)}}draw()}
function tap(){let n=0,t=7;card('💥 นิ้วไว','<p>กดหัวใจ 20 ครั้งใน 7 วินาที</p><div class="timer" id="tm">7</div><div class="big" id="num">0</div>');G.firstChild.append(B('💗 กด!',()=>{n++;$('num').textContent=n;add('c',1);if(n>=20)next()},'pink'));timers.push(setInterval(()=>{t--;if($('tm'))$('tm').textContent=t;if(t<=0){stop();if(n<20)add('g',8);next()}},1000))}
function prank(){let n=0;card('😈 ปุ่มต้องห้าม','<p class="story" id="m">หมูบอกว่า “ห้ามกดปุ่มนี้เด็ดขาด”</p>');G.firstChild.append(B('🚫 ห้ามกด',()=>{n++;add('c',5);$('m').textContent=n<3?'เฮ้ยยย บอกว่าห้ามกด 😂':'ออมโดนหมูหลอกแล้ว!';if(n>=3){G.firstChild.append(B('ไปต่อ',next,'pink'))}}))}
function end(){let type=S.l>=75?'💗 SWEET ENDING':S.c>=30?'😂 CHAOS ENDING':S.g>=15?'😤 งอน ENDING':'💕 NORMAL ENDING';card(type,'<div class="big">🐷❤️💗</div><p class="story">เกมนี้หมูสร้างขึ้นมาเพราะอยากให้ออมยิ้ม<br><br><b>หมูรักออมนะ ❤️</b></p><p>❤️ '+S.l+' · 😂 '+S.c+' · 😤 '+S.g+'</p>');G.firstChild.append(B('เล่นใหม่ 🔄',()=>location.reload(),'pink'))}draw();</script></body></html>
