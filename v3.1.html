<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🐷 หมู × 💗 ออม</title><style>*{box-sizing:border-box}body{margin:0;background:#160b18;color:#fff;font-family:system-ui,sans-serif}#app{max-width:540px;margin:auto;padding:10px 12px 30px}.stats{position:sticky;top:0;z-index:4;background:#160b18ee;padding:6px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat,.card{background:#ffffff10;border:1px solid #ffffff1c;border-radius:18px}.stat{text-align:center;padding:8px 2px;font-weight:900;font-size:13px}.card{margin-top:12px;padding:18px}.title{text-align:center;font-size:25px;font-weight:900}.story{font-size:17px;line-height:1.65}.big{text-align:center;font-size:62px}.btn{width:100%;border:0;border-radius:14px;padding:14px;margin:7px 0;font-size:16px;font-weight:900}.pink{background:#ff72a8;color:#fff}.danger{background:#ff5577;color:#fff}.timer{text-align:center;font-size:25px;font-weight:900}.mini{position:relative;height:300px;background:#09070d;border-radius:15px;overflow:hidden}.heart{position:absolute;font-size:40px;cursor:pointer}.meter{text-align:center;font-size:30px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{height:62px;border:0;border-radius:12px;background:#ffffff18;color:#fff;font-size:24px;font-weight:900}.open{background:#ff72a8}.small{text-align:center;color:#cbb8ca;font-size:13px}.bar{height:14px;background:#ffffff18;border-radius:20px;overflow:hidden}.fill{height:100%;background:#ff72a8}.chat{background:#fff;color:#241426;border-radius:14px;padding:10px;margin:7px 0}.badge{display:inline-block;background:#ffd166;color:#241426;border-radius:99px;padding:6px 9px;margin:3px;font-weight:900}</style></head><body><div id="app"><div class="stats"><div class="stat">❤️ <span id="love">50</span></div><div class="stat">😂 <span id="chaos">0</span></div><div class="stat">😤 <span id="sulk">0</span></div><div class="stat">🪙 <span id="coins">3</span></div></div><main id="game"></main></div><script>
'use strict';
const S={stage:0,love:50,chaos:0,sulk:0,coins:3,clues:0,ach:[]};let timers=[];
const $=id=>document.getElementById(id);function stop(){timers.forEach(clearInterval);timers=[]}function upd(){['love','chaos','sulk','coins'].forEach(k=>$(k).textContent=S[k])}function add(k,v){S[k]=Math.max(0,S[k]+v);upd()}function award(x){if(!S.ach.includes(x)){S.ach.push(x);S.clues++}}function next(){S.stage++;render()}function btn(t,fn,cl=''){const b=document.createElement('button');b.className='btn '+cl;b.textContent=t;b.addEventListener('click',fn);return b}function shell(t,html){stop();const c=document.createElement('section');c.className='card';c.innerHTML='<div class="title">'+t+'</div>'+html;$('game').replaceChildren(c);upd();return c}
function intro(){const c=shell('🐷 หมู × 💗 ออม','<div class="big">🐷💗</div><p class="story">หมูมีภารกิจลับให้ออม วันนี้ต้องผ่านทั้งเกมจริง เกมแกล้ง และเกมวัดใจ 😏<br><br><b>คนที่ชนะอาจไม่ใช่คนที่เก่งที่สุด แต่เป็นคนที่รักกันที่สุด ❤️</b></p>');c.append(btn('เริ่มเกม 💕',next,'pink'))}
function hunt(){let n=0,t=15;const c=shell('1/22 💗 ล่าหัวใจ','<p class="story">แตะหัวใจ 7 ดวงก่อนหมดเวลา</p><div class="timer" id="tm">15</div>');const a=document.createElement('div');a.className='mini';const h=document.createElement('div');h.className='heart';h.textContent='💗';a.append(h);c.append(a);const p=document.createElement('p');p.className='small';p.textContent='0/7';c.append(p);const move=()=>{h.style.left=Math.random()*85+'%';h.style.top=Math.random()*80+'%'};h.addEventListener('click',()=>{n++;p.textContent=n+'/7';add('love',2);if(n>=7){award('นักล่าหัวใจ');next()}else move()});move();timers.push(setInterval(()=>{t--;if($('tm'))$('tm').textContent=t;if(t<=0){stop();add('chaos',4);const x=shell('หัวใจหนี 😂','<p class="story">หมูแอบขำอยู่แน่ ๆ</p>');x.append(btn('ไปต่อ',next))}},1000))}
function date(){const c=shell('2/22 🗺️ เลือกเดต','<p class="story">ถ้ามีหนึ่งวันกับออม หมูจะพาไปไหน?</p>');[['🍜 กินของอร่อย',8,1],['🌳 เดินเล่น',6,3],['🎮 เล่นเกม',3,10],['🏠 ดูหนังที่บ้าน',7,0]].forEach(x=>c.append(btn(x[0],()=>{add('love',x[1]);add('chaos',x[2]);next()})))}
function budget(){let money=500;const c=shell('3/22 🪙 งบเดต 500 บาท','<p class="story">ซื้อของให้เดตได้ แต่ห้ามเกิน 500</p>');const p=document.createElement('p');p.className='small';p.textContent='เหลือ 500 บาท';c.append(p);[['🍜 120',120,4],['🧋 80',80,3],['🍰 160',160,6],['🎁 90',90,5]].forEach(x=>c.append(btn(x[0]+'฿',()=>{if(money>=x[1]){money-=x[1];add('love',x[2]);p.textContent='เหลือ '+money+' บาท'}})));c.append(btn('จบเดต 💕',next,'pink'))}
function chat(){let q=0;const qs=['คิดถึงหมูไหม?','วันนี้เหนื่อยไหม?','ถ้าออมงอน หมูควรทำไง?','รักหมูแค่ไหน?'];const c=shell('4/22 💬 แชตกับออม','<div id="cb"></div>');function draw(){const b=$('cb');b.innerHTML='<div class="chat">ออม: '+qs[q]+'</div>';[['ตอบจริงใจ ❤️',6,0],['ตอบกวน 😂',2,5],['แกล้งเปลี่ยนเรื่อง 😏',0,3]].forEach(x=>b.append(btn(x[0],()=>{add('love',x[1]);add('chaos',x[2]);q++;if(q===4)next();else draw()})))}draw()}
function memory(){const vals=['❤️','🍜','🎮','🐷','❤️','🍜','🎮','🐷'].sort(()=>Math.random()-.5),open=[],matched=[];const c=shell('5/22 🧠 จำเรื่องของเรา','<p class="story">จับคู่ 4 คู่</p>');const g=document.createElement('div');g.className='memory';c.append(g);function draw(){g.replaceChildren();vals.forEach((v,i)=>{const b=btn(open.includes(i)||matched.includes(i)?v:'?',()=>flip(i));b.className='tile '+(open.includes(i)||matched.includes(i)?'open':'');g.append(b)})}function flip(i){if(open.includes(i)||matched.includes(i)||open.length===2)return;open.push(i);draw();if(open.length===2){if(vals[open[0]]===vals[open[1]]){matched.push(...open);open.length=0;add('love',3);if(matched.length===8){award('จำเรื่องของเรา');setTimeout(next,300)}else draw()}else setTimeout(()=>{open.length=0;draw()},450)}}draw()}
function tap(){let n=0,t=8;const c=shell('6/22 💥 นิ้วไว','<p class="story">กดหัวใจ 25 ครั้งใน 8 วินาที</p><div class="timer" id="tm">8</div><div class="meter" id="num">0/25</div>');c.append(btn('💗 กด!',()=>{n++;$('num').textContent=n+'/25';add('chaos',1);if(n>=25){award('นิ้วไว');next()}},'pink'));timers.push(setInterval(()=>{t--;if($('tm'))$('tm').textContent=t;if(t<=0){stop();if(n<25){add('sulk',8);const x=shell('ไม่ทัน 😤','<p class="story">คราวนี้หมูโดนงอนแล้ว</p>');x.append(btn('ไปง้อ',next))}}},1000))}
function prank(){let n=0;const c=shell('7/22 😈 ปุ่มต้องห้าม','<p class="story" id="pm">หมูบอกว่า “ห้ามกดปุ่มนี้เด็ดขาด”</p>');const b=btn('🚫 ห้ามกด',()=>{n++;add('chaos',4);$('pm').textContent=n<3?'เฮ้ย! บอกว่าห้ามกด 😂':'โอเค ออมชนะความกวนแล้ว';if(n>=3){b.textContent='ไปต่อ';b.replaceWith(btn('ไปต่อ',next,'pink'))}},'danger');c.append(b)}
function dodge(){let hp=3,t=12,pos=45;const c=shell('8/22 🐷 หลบระเบิด','<p class="story">ใช้ปุ่มซ้ายขวา หลบ 💣 12 วินาที</p><div class="timer" id="tm">12</div>');const a=document.createElement('div');a.className='mini';const pig=document.createElement('div');pig.textContent='🐷';pig.style.cssText='position:absolute;top:235px;left:45%;font-size:45px';a.append(pig);c.append(a);const co=document.createElement('div');co.className='grid';co.append(btn('⬅️',()=>move(-14)),btn('➡️',()=>move(14)));c.append(co);const p=document.createElement('p');p.className='small';p.textContent='❤️❤️❤️';c.append(p);function move(v){pos=Math.max(0,Math.min(90,pos+v));pig.style.left=pos+'%'}function spawn(){const e=document.createElement('div');e.textContent='💣';e.style.cssText='position:absolute;font-size:35px;left:'+Math.random()*88+'%;top:-45px';a.append(e);let y=-45;const id=setInterval(()=>{y+=8;e.style.top=y+'px';if(y>220&&y<285&&Math.abs(parseFloat(e.style.left)-pos)<12){clearInterval(id);e.remove();hp--;p.textContent='❤️'.repeat(hp);if(hp<=0){stop();const x=shell('💥 โดนแล้ว','<p class="story">หมูต้องมาช่วยออมง้อแล้ว 😂</p>');x.append(btn('ไปต่อ',next))}}if(y>320){clearInterval(id);e.remove()}},40);timers.push(id)}timers.push(setInterval(spawn,650));timers.push(setInterval(()=>{t--;if($('tm'))$('tm').textContent=t;if(t<=0){stop();award('ผู้พิทักษ์หัวใจ');add('love',8);const x=shell('รอดแล้ว! 🎉','<p class="story">ออมเก่งมาก หมูยอมแพ้</p>');x.append(btn('ไปต่อ',next,'pink'))}},1000))}
