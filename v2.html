<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>🐷 × 💗 เกมของออม</title><style>*{box-sizing:border-box}body{margin:0;background:#100914;color:#fff;font-family:system-ui,sans-serif;touch-action:manipulation}.app{max-width:560px;margin:auto;min-height:100dvh;padding:10px;display:flex;flex-direction:column;gap:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.p{background:#25162c;border:1px solid #56345f;border-radius:12px;padding:7px;text-align:center;font-size:12px}.p b{font-size:16px}.bar{height:9px;background:#34233b;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#ff4f91}.game{flex:1;min-height:calc(100dvh - 90px);background:radial-gradient(circle at 50% 15%,#40244b,#130b18 70%);border:2px solid #5b3865;border-radius:22px;padding:18px;overflow:auto;text-align:center}.center{min-height:100%;display:flex;flex-direction:column;justify-content:center}.emoji{font-size:70px}h1{font-size:clamp(30px,9vw,44px)}h2{font-size:clamp(21px,6vw,29px)}p{line-height:1.6}.btn{width:min(100%,420px);min-height:52px;margin:7px auto;padding:13px;border:0;border-radius:15px;background:#ff4f91;color:white;font-weight:800;font-size:16px;box-shadow:0 4px #a62d5b}.alt{background:#30203a;box-shadow:0 4px #171019}.card{background:#211622;border:1px solid #55365e;border-radius:17px;padding:14px;margin:12px auto;max-width:450px}.arena{height:320px;position:relative;background:#190f20;border-radius:18px;overflow:hidden}.target{position:absolute;background:none;border:0;font-size:45px;padding:12px}.tap{width:min(75vw,300px);height:min(75vw,300px);margin:15px auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#2d1c34;border:5px solid #754b80;font-size:72px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tile{aspect-ratio:1;border:0;border-radius:11px;background:#3a2841;color:white;font-size:26px}.open{background:#ff4f91}.meter{height:18px;background:#39283e;border-radius:20px;overflow:hidden}.meter i{display:block;height:100%;width:60%;background:#ff4f91}.slider{width:90%}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nums button{padding:15px;border:2px solid #503259;border-radius:14px;background:#25172c;color:white;font-size:22px}@media(max-width:420px){.arena{height:280px}}</style></head><body><div class="app"><div class="stats"><div class="p">❤️<br><b id="love">50</b></div><div class="p">😂<br><b id="chaos">0</b></div><div class="p">🪙<br><b id="coins">0</b></div><div class="p">ด่าน<br><b id="stage">1/18</b></div></div><div class="bar"><i id="progress"></i></div><main class="game" id="game"></main></div><script>'use strict';const S={n:0,love:50,chaos:0,coins:0};let timer=null;const $=x=>document.getElementById(x),stop=()=>{if(timer){clearInterval(timer);timer=null}},add=(l=0,c=0,m=0)=>{S.love=Math.max(0,Math.min(100,S.love+l));S.chaos+=c;S.coins+=m;stats()},stats=()=>{$('love').textContent=S.love;$('chaos').textContent=S.chaos;$('coins').textContent=S.coins;$('stage').textContent=Math.min(S.n+1,18)+'/18';$('progress').style.width=(S.n/18*100)+'%'},next=()=>{stop();S.n++;stats();setTimeout(render,150)};function choice(title,e,text,items){$('game').innerHTML='<div class="center"><div class="emoji">'+e+'</div><h2>'+title+'</h2><p>'+text+'</p><div>'+items.map((x,i)=>'<button class="btn '+(i?'alt':'')+'" data-i="'+i+'">'+x[0]+'</button>').join('')+'</div></div>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>items[+b.dataset.i][1]())}function intro(){choice('เกมของออม','🐷💗','หมูทำเกมนี้ให้ออมเล่นโดยเฉพาะ เล่นด้วยนิ้วได้เลย และอย่าเชื่อทุกอย่างที่เกมบอก 😏',[['เริ่มเลย 💗',next],['ขอเตรียมใจก่อน 😂',()=>{add(0,3);next()}]])}function hunt(){let n=0,t=12;$('game').innerHTML='<h2>ด่าน 2 — จับหัวใจ 💗</h2><p>แตะหัวใจ 6 ครั้งก่อนหมดเวลา</p><p id="info">0/6 · 12 วิ</p><div class="arena" id="a"></div>';let a=$('a');function spawn(){a.innerHTML='';let b=document.createElement('button');b.className='target';b.textContent='💗';b.style.left=(Math.random()*80+3)+'%';b.style.top=(Math.random()*72+2)+'%';b.onclick=()=>{n++;add(2,1,1);n>=6?next():spawn()};a.appendChild(b)}spawn();timer=setInterval(()=>{t--;$('info').textContent=n+'/6 · '+t+' วิ';if(t<=0){stop();$('game').innerHTML='<div class="center"><h2>หัวใจหนี 😂</h2><button class="btn" onclick="hunt()">ลองใหม่</button></div>'}},1000)}function dates(){choice('ด่าน 3 — เดตในฝัน','🥰','ถ้ามีเวลาหนึ่งวัน ออมอยากไปไหนกับหมู?',[['🍜 กินของอร่อย',()=>{add(8,0,2);next()}],['🚗 ขับรถเที่ยว',()=>{add(10,1,2);next()}],['🏠 อยู่ด้วยกัน',()=>{add(12,0,1);next()}],['🎬 ดูหนัง',()=>{add(7,1,2);next()}]])}function chat(){choice('ด่าน 4 — แชตกับหมู','📱','หมู: “คิดถึงนะ”',[['คิดถึงเหมือนกัน ❤️',()=>{add(12,0,2);next()}],['คิดถึงนิดเดียว 😳',()=>{add(8,1,2);next()}],['ไม่บอกหรอก 😏',()=>{add(5,4,1);next()}]])}function memory(){let v=['🐷','🐷','💗','💗','🍜','🍜','🎁','🎁'].sort(()=>Math.random()-.5),o=[],d=0,lock=false;$('game').innerHTML='<h2>ด่าน 5 — จำให้แม่น 🧠</h2><p>จับคู่ 4 คู่</p><div class="grid" id="m"></div>';v.forEach(x=>{let b=document.createElement('button');b.className='tile';b.textContent='❓';b.onclick=()=>{if(lock||b.classList.contains('open'))return;b.classList.add('open');b.textContent=x;o.push([b,x]);if(o.length===2){lock=true;if(o[0][1]===o[1][1]){d++;o=[];lock=false;add(3,0,1);if(d===4)next()}else setTimeout(()=>{o.forEach(q=>{q[0].classList.remove('open');q[0].textContent='❓'});o=[];lock=false},450)}};$('m').appendChild(b)})}function tap(){let n=0,t=9;$('game').innerHTML='<h2>ด่าน 6 — หัวใจเต้นแรง 💓</h2><p>แตะ 18 ครั้งใน 9 วิ</p><p><b id="n">0</b>/18 · <b id="t">9</b> วิ</p><div class="tap" id="z">💗</div>';$('z').onclick=()=>{n++;add(1,1);$('n').textContent=n;if(n>=18)next()};timer=setInterval(()=>{t--;$('t').textContent=t;if(t<=0){stop();n>=12?next():$('game').innerHTML='<div class="center"><h2>ยังไม่แรงพอ 😆</h2><button class="btn" onclick="tap()">เอาใหม่</button></div>'}},1000)}function prank(){choice('ด่าน 7 — อย่ากด','🚫','เกมเขียนชัด ๆ ว่า “ห้ามกด” ออมจะเชื่อไหม?',[['กดเลย 😂',()=>{add(2,6,3);next()}],['ไม่กดหรอก',()=>{add(8,0,2);next()}]])}function dodge(){let t=10,h=3;$('game').innerHTML='<h2>ด่าน 8 — ปกป้องหัวใจ 🛡️</h2><p>ลาก 🐷 หลบ 💣</p><div class="arena" id="d"><div id="p" style="position:absolute;bottom:7px;left:45%;font-size:42px">🐷</div></div><p>❤️ <b id="h">3</b> · ⏱️ <b id="dt">10</b></p><input class="slider" id="s" type="range" min="4" max="88" value="45">';let d=$('d'),p=$('p');$('s').oninput=e=>p.style.left=e.target.value+'%';timer=setInterval(()=>{t--;$('dt').textContent=t;let b=document.createElement('div');b.textContent='💣';b.style.cssText='position:absolute;top:-5%;left:'+(Math.random()*88)+'%;font-size:30px';d.appendChild(b);let y=-5,f=setInterval(()=>{y+=5;b.style.top=y+'%';if(y>92){clearInterval(f);if(Math.abs(parseFloat(p.style.left)-parseFloat(b.style.left))<9){h--;add(-3,2)}b.remove();$('h').textContent=h;if(h<=0){stop();$('game').innerHTML='<div class="center"><h2>💥 โดนแล้ว!</h2><button class="btn" onclick="dodge()">ลองใหม่</button></div>'}}},70);if(t<=0){stop();next()}},1000)}function q(){choice('ด่าน 9 — หมูรู้ใจออมไหม?','🤔','ถ้าหมูชวนเดตแบบกะทันหัน ออมเลือกอะไร?',[['🍜 ของอร่อย',()=>{add(8,1,2);next()}],['🚗 ขับรถเล่น',()=>{add(8,1,2);next()}],['❤️ อะไรก็ได้ถ้าไปกับหมู',()=>{add(15,0,3);next()}],['😂 แกล้งหมู',()=>{add(3,5,1);next()}]])}function gift(){choice('ด่าน 10 — ของขวัญ','🎁','ถ้าออมเลือกของขวัญให้หมูได้หนึ่งอย่าง?',[['💌 จดหมาย',()=>{add(15,0,3);next()}],['🍫 ของกิน',()=>{add(10,1,3);next()}],['💗 กอด',()=>{add(18,0,2);next()}]])}function sulk(){let a=60;$('game').innerHTML='<h2>ด่าน 11 — ออมงอนแล้ว 😤</h2><div class="card">“หมูรู้ไหมว่าออมงอน?”</div><div class="meter"><i id="ang"></i></div><button class="btn" onclick="sorry(20,3)">🥺 ขอโทษครับ</button><button class="btn alt" onclick="sorry(15,2)">🍰 เลี้ยงขนม</button><button class="btn alt" onclick="sorry(-10,5)">😂 งอนอะไรครับ</button>';window.sorry=(v,c)=>{a=Math.max(0,a-v);$('ang').style.width=a+'%';add(v>0?3:-5,c);if(a<=0){delete window.sorry;next()}}}function route(){choice('ด่าน 12 — ทางแยก','🛣️','ซ้ายคือความป่วน ขวาคือความหวาน',[['😂 ป่วนหมู',()=>{add(4,8,2);next()}],['❤️ อยู่ข้างหมู',()=>{add(15,0,3);next()}]])}function code(){let a=[];$('game').innerHTML='<h2>ด่าน 13 — รหัสลับ 🔐</h2><p>กดเลข 3 ตัว</p><div class="nums">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button data-num="'+n+'">'+n+'</button>').join('')+'</div><p id="c">_ _ _</p>';document.querySelectorAll('[data-num]').forEach(b=>b.onclick=()=>{if(a.length<3){a.push(+b.dataset.num);$('c').textContent=a.join(' ');if(a.length===3){let ok=a.join('')==='527';add(ok?18:5,ok?0:3,ok?5:2);setTimeout(next,400)}}})}function promise(){choice('ด่าน 14 — คำสัญญา','🤝','ถ้าเลือกคำสัญญาได้หนึ่งข้อ',[['❤️ จะอยู่ข้างกัน',()=>{add(18,0,4);next()}],['😂 จะกวนกันทุกวัน',()=>{add(10,6,3);next()}],['🥺 งอนก็ต้องง้อ',()=>{add(14,1,3);next()}]])}function boss(){let n=0,t=8;$('game').innerHTML='<h2>ด่าน 15 — บอสใหญ่ 💗</h2><p>แตะหัวใจ 12 ครั้งใน 8 วิ</p><p><b id="bn">0</b>/12 · <b id="bt">8</b></p><div class="tap" id="bz">❤️</div>';$('bz').onclick=()=>{n++;add(2,0,1);$('bn').textContent=n;if(n>=12)next()};timer=setInterval(()=>{t--;$('bt').textContent=t;if(t<=0){stop();n>=8?next():$('game').innerHTML='<div class="center"><h2>บอสยังไม่ยอมแพ้ 😈</h2><button class="btn" onclick="boss()">สู้อีกครั้ง</button></div>'}},1000)}function last(){choice('ด่าน 16 — คำถามสุดท้าย','💗','ถ้าพรุ่งนี้ไม่มีเกม ไม่มีคะแนน ไม่มีอะไรเลย…ออมจะเลือกอะไร?',[['🐷 เลือกหมู',()=>{add(25,0,5);next()}],['❤️ เลือกเรา',()=>{add(22,0,5);next()}],['😂 เล่นต่อก่อน',()=>{add(12,8,3);next()}]])}function bonus(){choice('ด่าน 17 — โบนัสของหมู','🎁','หมูมีของรางวัลให้ เลือกหนึ่งอย่าง',[['💗 ความรัก',()=>{add(20,0,5);next()}],['😂 ความป่วน',()=>{add(8,10,3);next()}],['🥺 กอด',()=>{add(22,0,4);next()}]])}function end(){stop();S.n=18;stats();$('game').innerHTML='<div class="center"><div class="emoji">🐷💗</div><h1>ออมเล่นจบแล้ว!</h1><div class="card">เกมนี้หมูทำมาเพื่อแกล้งออมจริง ๆ 😂<br><br>แต่เรื่องนี้ไม่ได้แกล้งนะ…<h2>หมูรักออมจริง ๆ ❤️</h2>ไม่ว่าออมจะเลือกอะไร สุดท้ายหมูก็ยังเลือกออมอยู่ดี</div><p>❤️ '+S.love+' · 😂 '+S.chaos+' · 🪙 '+S.coins+'</p><button class="btn" onclick="location.reload()">เล่นใหม่ 🔄</button></div>'}function render(){stop();switch(S.n){case 0:intro();break;case 1:hunt();break;case 2:dates();break;case 3:chat();break;case 4:memory();break;case 5:tap();break;case 6:prank();break;case 7:dodge();break;case 8:q();break;case 9:gift();break;case 10:sulk();break;case 11:route();break;case 12:code();break;case 13:promise();break;case 14:boss();break;case 15:last();break;case 16:bonus();break;default:end()}}render();stats();</script></body></html>
