<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🐷 หมู × 💗 ออม — Love Adventure V3</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#160b18,#25122b 55%,#100b16);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh}#app{width:min(100%,540px);margin:auto;padding:12px 12px 28px}.top{position:sticky;top:0;z-index:5;background:#160b18ee;backdrop-filter:blur(10px);padding:8px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{background:#ffffff12;border:1px solid #ffffff18;border-radius:14px;padding:8px;text-align:center;font-weight:800;font-size:14px}.card{margin-top:12px;background:#ffffff0d;border:1px solid #ffffff18;border-radius:24px;padding:18px;box-shadow:0 15px 45px #0005}.title{font-size:28px;font-weight:900;text-align:center}.story{font-size:17px;line-height:1.65;color:#f7eaf8}.big{font-size:70px;text-align:center;margin:10px}.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;margin:9px 0;background:#fff;color:#201223;font-size:16px;font-weight:900;cursor:pointer;touch-action:manipulation}.btn:active{transform:scale(.97)}.pink{background:#ff72a8;color:#fff}.gold{background:#ffd166}.danger{background:#ff5577;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.mini{position:relative;height:300px;background:#0c0810;border-radius:18px;overflow:hidden;border:1px solid #ffffff18}.heart{position:absolute;font-size:38px;cursor:pointer;user-select:none}.target{position:absolute;font-size:46px;cursor:pointer;user-select:none}.bar{height:14px;background:#ffffff18;border-radius:20px;overflow:hidden;margin:10px 0}.fill{height:100%;width:50%;background:#ff72a8}.timer{text-align:center;font-size:25px;font-weight:900}.choices{display:grid;gap:9px}.chat{background:#fff;color:#24152a;border-radius:16px;padding:12px;margin:8px 0;max-width:88%}.me{margin-left:auto;background:#ffb5cd}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{height:62px;border:0;border-radius:14px;background:#ffffff18;color:#fff;font-size:25px;font-weight:900}.tile.open{background:#ff72a8}.hide{display:none}.small{font-size:13px;color:#cbb9cf;text-align:center}.badge{display:inline-block;background:#ffd166;color:#24152a;padding:6px 10px;border-radius:99px;font-weight:900;margin:4px}.meter{font-size:42px;text-align:center}@media(max-width:380px){.title{font-size:24px}.card{padding:14px}.story{font-size:16px}}
</style></head><body><div id="app"><div class="top"><div class="stats"><div class="stat">❤️ <span id="love">50</span></div><div class="stat">😂 <span id="chaos">0</span></div><div class="stat">😤 <span id="sulk">0</span></div><div class="stat">🪙 <span id="coins">3</span></div></div></div><main id="game"></main></div><script>
const S={n:0,love:50,chaos:0,sulk:0,coins:3,clues:0,ach:[],flags:{}};let timers=[];function stop(){timers.forEach(clearInterval);timers=[]}function add(k,v){S[k]=Math.max(0,S[k]+v);upd()}function upd(){["love","chaos","sulk","coins"].forEach(k=>document.getElementById(k).textContent=S[k])}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function ach(x){if(!S.ach.includes(x)){S.ach.push(x);S.clues++;}}function next(){stop();S.n++;render()}function btn(t,fn,c=""){return `<button class="btn ${c}" onclick="${fn}">${t}</button>`}function shell(t,body){document.getElementById('game').innerHTML=`<section class="card"><div class="title">${t}</div>${body}</section>`;upd()}
function render(){const f=[intro,hunt,date,budget,chat,memory,tap,prank,dodge,quiz,gift,sulkGame,route,code,truth,protect,chaosGame,promise,boss,finalChoice,bonus,ending][S.n]||ending;f()}
function intro(){shell('🐷 หมู × 💗 ออม',`<div class="big">🐷💗</div><p class="story">ออมเปิดเกมมาแล้วเจอข้อความจากหมูว่า...<br><b>“ถ้าออมคิดว่ารู้จักหมูดีพอ ก็ลองเล่นดู 😏”</b><br><br>ภารกิจวันนี้คือเอาชนะเกมของแฟนตัวเองให้ได้ และค้นหา <b>ความลับของหมู</b> ที่ซ่อนอยู่ระหว่างทาง</p>${btn('เริ่มภารกิจ 💕','next()','pink')}<p class="small">เกมนี้มีหลายตอน มีเกมจริง และบางคำตอบมีผลต่อฉากจบ</p>`)}
function hunt(){let hit=0,t=15;function move(){const e=document.querySelector('.heart');if(!e)return;e.style.left=Math.random()*82+'%';e.style.top=Math.random()*75+'%'}function click(){hit++;add('love',2);if(hit>=7){ach('นักล่าหัวใจ');next()}else{document.getElementById('hc').textContent=hit;move()}}shell('1/22 💗 ล่าหัวใจของหมู',`<p class="story">หัวใจวิ่งหนี! แตะให้ได้ 7 ดวงก่อนหมดเวลา</p><div class="timer" id="ht">15</div><div class="mini"><div class="heart" onclick="(${click.toString()})()">💗</div></div><p class="small">จับได้ <b id="hc">0</b>/7</p>`);move();timers.push(setInterval(()=>{t--;document.getElementById('ht').textContent=t;if(t<=0){stop();add('chaos',3);shell('พลาดแล้ว 😂',`<p class="story">หัวใจหนีไปหมดแล้ว ออมโดนหมูแกล้งหนึ่งดอก</p>${btn('ไปต่อ','next()')}`)}},1000))}
function date(){shell('2/22 🗺️ เลือกเดต',`<p class="story">หมูมีเวลาหนึ่งวันเต็ม จะพาออมไปไหน?</p><div class="choices">${btn('🍜 ของกินร้านโปรด +8 ❤️','pickDate(8,1)')}${btn('🌳 เดินเล่น +5 ❤️ +3 😂','pickDate(5,3)')}${btn('🎮 เล่นเกมด้วยกัน +10 😂','pickDate(2,10)')}${btn('🏠 อยู่บ้านดูหนัง +7 ❤️','pickDate(7,0)')}</div>`)}function pickDate(l,c){add('love',l);add('chaos',c);S.flags.date=c>5?'game':'sweet';next()}
function budget(){let left=500,score=0;function buy(cost,l,c){if(left<cost)return;left-=cost;score+=l;add('love',c);document.getElementById('money').textContent=left;document.getElementById('score').textContent=score}shell('3/22 🪙 งบเดต 500 บาท',`<p class="story">ซื้อของให้พอดี งบหมดแล้วจบเกมทันที แต่ความรักต้องไม่หมดนะ 😆</p><div class="stat">เหลือ <span id="money">500</span> บาท · ❤️ <span id="score">0</span></div>${btn('🍜 ก๋วยเตี๋ยว 120 (+8)','buy(120,8,2)')}${btn('🧋 ชานม 80 (+5)','buy(80,5,1)')}${btn('🍰 เค้ก 160 (+10)','buy(160,10,3)')}${btn('🎁 ของเล็ก ๆ 90 (+6)','buy(90,6,2)')}${btn('จบเดต 💕','next()','pink')}`)}
function chat(){let q=0;const lines=[['ออม: วันนี้คิดถึงไหม?','คิดถึงสิ มากด้วย ❤️'],['ออม: เมื่อคืนแอบเล่นเกมโดยไม่บอกใช่ไหม?','เอ่อ...ไม่มั้ง 😳'],['ออม: ถ้าออมงอน หมูจะทำไง?','ง้อครับ ไม่หนีแน่นอน'],['ออม: รักออมแค่ไหน?','มากกว่าที่ออมคิดอีก']];function ans(i){q++;if(i===1)add('love',6);else if(i===2)add('chaos',4);else add('love',2);if(q>=4)next();else draw()}function draw(){document.getElementById('chatbox').innerHTML=lines.slice(0,q+1).map(x=>`<div class="chat">${x[0]}</div><div class="chat me">${x[1]}</div>`).join('')+`<div class="choices">${btn('ตอบจริงใจ ❤️','ans(1)')}${btn('ตอบกวน ๆ 😂','ans(2)')}${btn('แกล้งเปลี่ยนเรื่อง 😏','ans(3)')}</div>`}shell('4/22 💬 แชตกับออม',`<div id="chatbox"></div>`);draw()}
function memory(){const vals=['❤️','🍜','🎮','🐷','❤️','🍜','🎮','🐷'];let open=[],done=0;vals.sort(()=>Math.random()-.5);shell('5/22 🧠 ความจำแฟน',`<p class="story">เปิดไพ่หาคู่ให้ครบ 4 คู่</p><div class="memory" id="mem"></div>`);function draw(){document.getElementById('mem').innerHTML=vals.map((v,i)=>`<button class="tile ${open.includes(i)?'open':''}" onclick="flip(${i})">${open.includes(i)?v:'?'}</button>`).join('')}window.flip=function(i){if(open.includes(i)||open.length===2)return;open.push(i);draw();if(open.length===2){if(vals[open[0]]===vals[open[1]]){done++;add('love',3);open=[];if(done===4){ach('จำเรื่องของเรา');setTimeout(next,400)}else draw()}else setTimeout(()=>{open=[];draw()},550)}};draw()}
function tap(){let n=0,t=8;function hit(){n++;add('chaos',1);document.getElementById('tapn').textContent=n;if(n>=25){ach('นิ้วไวแฟนรัก');next()}}shell('6/22 💥 ปุ่มหัวใจ',`<p class="story">หมูบอกว่า “กดหัวใจ 25 ครั้งใน 8 วิ ถ้าทำได้มีรางวัล”</p><div class="timer" id="tt">8</div><div class="meter">💗 <span id="tapn">0</span>/25</div>${btn('กดเลย! 💗','hit()','pink')}`);timers.push(setInterval(()=>{t--;document.getElementById('tt').textContent=t;if(t<=0){stop();if(n<25){add('sulk',8);shell('หมดเวลา 😤',`<p class="story">ออมแพ้...และหมูกำลังหัวเราะอยู่แน่นอน 😂</p>${btn('เอาคืนหมู','next()','danger')}}},1000))}
function prank(){let tries=0;function bad(){tries++;add('chaos',5);document.getElementById('msg').textContent='บอกว่าอย่ากดไง! 😂';if(tries>=3){ach('นักแกล้ง');document.getElementById('msg').textContent='โอเค ๆ ยอมแล้ว ออมชนะความกวนของหมู';document.getElementById('go').textContent='ไปต่อ';document.getElementById('go').onclick=next}}shell('7/22 😈 ห้ามกดเด็ดขาด',`<p class="story" id="msg">หมูฝากบอกว่า <b>“ปุ่มนี้ห้ามกด”</b></p><button class="btn danger" id="go" onclick="(${bad.toString()})()">🚫 อย่ากด</button>`)}
function dodge(){let hp=3,t=12,pos=45;function move(v){pos=Math.max(0,Math.min(90,pos+v));document.getElementById('pig').style.left=pos+'%'}function fall(){const e=document.createElement('span');e.className='target';e.textContent='💣';e.style.left=Math.random()*90+'%';e.style.top='-50px';document.getElementById('arena').appendChild(e);let y=-50;const id=setInterval(()=>{y+=7;e.style.top=y+'px';const px=pos/100*document.getElementById('arena').clientWidth;if(y>220&&y<275&&Math.abs(parseFloat(e.style.left)/100*document.getElementById('arena').clientWidth-px)<55){clearInterval(id);e.remove();hp--;document.getElementById('hp').textContent=hp;if(hp<=0){stop();shell('💥 โดนเต็ม ๆ',`<p class="story">ออมปกป้องหัวใจไม่ทัน 😂</p>${btn('ไปต่อ','next()')}`)}}if(y>310){clearInterval(id);e.remove()}},40)}shell('8/22 🐷 หลบระเบิด',`<p class="story">ลากหมูซ้ายขวา หลบ 💣 ให้ครบ 12 วินาที</p><div class="timer" id="dt">12</div><div class="mini" id="arena"><div id="pig" class="target" style="left:45%;top:220px">🐷</div></div><div class="grid">${btn('⬅️','move(-12)')}${btn('➡️','move(12)')}</div><p>หัวใจเหลือ ❤️ <b id="hp">3</b></p>`);window.move=move;timers.push(setInterval(fall,700));timers.push(setInterval(()=>{t--;document.getElementById('dt').textContent=t;if(t<=0){stop();ach('ผู้พิทักษ์หัวใจ');add('love',8);shell('รอดแล้ว! 🎉',`<p class="story">ออมเก่งมาก หมูยอมรับเลย</p>${btn('ไปต่อ','next()','pink')}`)}},1000))}
function quiz(){shell('9/22 🔍 หมูรู้ใจออมไหม?',`<p class="story">ถ้าออมเหนื่อย หมูควรทำอะไรก่อน?</p>${btn('ปล่อยให้อยู่คนเดียว','quizA(0)')}${btn('ถามว่าโอเคไหม แล้วอยู่ข้าง ๆ ❤️','quizA(1)','pink')}${btn('ชวนเล่นเกมทันที','quizA(0)')}`)}function quizA(x){if(x){add('love',10);ach('รู้ใจออม')}else{add('sulk',10);add('chaos',3)}next()}
function gift(){shell('10/22 🎁 กล่องของขวัญ',`<p class="story">มี 3 กล่อง แต่มีแค่กล่องเดียวที่หมูเลือกมาให้ออมจริง ๆ</p><div class="grid">${btn('🎁 A','giftPick(0)')}${btn('🎁 B','giftPick(1)')}${btn('🎁 C','giftPick(2)')}</div><p class="small">ใบ้: หมูเลือกของที่ “ใช้ได้จริง” ไม่ใช่ของแพง</p>`)}function giftPick(x){if(x===1){add('love',12);add('coins',2);ach('ของขวัญถูกใจ')}else{add('chaos',6);add('sulk',4)}next()}
function sulkGame(){let m=100;function doIt(v,l){m=Math.max(0,m-v);add('love',l);document.getElementById('sm').style.width=m+'%';document.getElementById('sv').textContent=m;if(m<=0){ach('ง้อสำเร็จ');setTimeout(next,500)}}shell('11/22 😤 ออมงอน!',`<p class="story">เกจงอนเริ่มที่ 100 ลดให้เหลือ 0 ก่อนเวลาหมด</p><div class="bar"><div class="fill" id="sm" style="width:100%"></div></div><div class="meter">😤 <span id="sv">100</span></div>${btn('กอดก่อน 🤗 (-25 / +3❤️)','doIt(25,3)')}${btn('ขอโทษจริง ๆ (-35 / +6❤️)','doIt(35,6)','pink')}${btn('ส่งของกิน 🍜 (-20 / +2❤️)','doIt(20,2)')}`)}
function route(){shell('12/22 🗺️ เลือกทางลับ',`<p class="story">มีทาง 3 ทาง หมูบอกว่า “เลือกดี ๆ บางทางมีความลับ”</p>${btn('🌙 ทางเงียบ ๆ','routePick(0)')}${btn('🎈 ทางงานวัด','routePick(1)')}${btn('🐷 ทางหลังบ้านหมู','routePick(2)')}`)}function routePick(x){if(x===2){S.clues++;add('love',7);S.flags.secretRoute=true}else if(x===1)add('chaos',7);else add('love',4);next()}
function code(){let val='';function key(x){if(val.length<3)val+=x;document.getElementById('codev').textContent=val;if(val.length===3){if(val==='527'){S.clues++;add('love',15);ach('รหัสลับของเรา');shell('🔓 เปิดความลับ!',`<p class="story">รหัสถูกต้อง! ข้างในมีข้อความว่า<br><b>“ขอบคุณที่ยังอยู่ข้าง ๆ กันนะ 💗”</b></p>${btn('ไปต่อ','next()','pink')})}else{add('chaos',5);val='';document.getElementById('codev').textContent=''}}}shell('13/22 🔐 รหัสลับ',`<p class="story">หมูทิ้งเลขไว้ 3 ตัว: จำจากเกมก่อน ๆ ให้ได้</p><div class="meter" id="codev">_ _ _</div><div class="grid">${[1,2,3,4,5,6,7,8,9].map(x=>btn(x,'key('+x+')')).join('')}</div>`);window.key=key}
function truth(){shell('14/22 💗 เรื่องจริง 1 ข้อ',`<p class="story">ข้อไหนจริงที่สุด?</p>${btn('หมูชอบชนะทุกเกม','truthA(0)')}${btn('หมูชอบแกล้งออม เพราะเห็นออมยิ้ม','truthA(1)','pink')}${btn('หมูไม่เคยกลัวออมงอน','truthA(0)')}`)}function truthA(x){if(x){add('love',10);S.clues++}else add('chaos',4);next()}
function protect(){let t=10,n=0;function hit(){n++;add('love',1);document.getElementById('pn').textContent=n;if(n>=15){ach('ปกป้องออม');next()}}shell('15/22 🛡️ ปกป้องหัวใจ',`<p class="story">หัวใจกำลังโดนคำว่า “งานยุ่ง” ไล่ตาม! แตะให้ทัน 15 ครั้ง</p><div class="timer" id="pt">10</div><div class="meter">🛡️ <span id="pn">0</span>/15</div>${btn('❤️ ปกป้อง!','hit()','pink')}`);window.hit=hit;timers.push(setInterval(()=>{t--;document.getElementById('pt').textContent=t;if(t<=0){stop();add('sulk',6);shell('เกือบไม่ทัน 😭',`<p class="story">ครั้งนี้หมูต้องรีบง้อแล้ว</p>${btn('ไปต่อ','next()')}`)}},1000))}
function chaosGame(){let n=0,t=7;function hit(){n++;document.getElementById('cn').textContent=n;add('chaos',2);if(n>=18){ach('ราชาแห่งความปั่น');next()}}shell('16/22 😂 ความปั่นระดับแฟน',`<p class="story">กด 🐷 ให้ครบ 18 ครั้งใน 7 วิ!</p><div class="timer" id="ct">7</div><div class="meter">🐷 <span id="cn">0</span>/18</div>${btn('🐷 ปั่นหมู!','hit()')}`);window.hit=hit;timers.push(setInterval(()=>{t--;document.getElementById('ct').textContent=t;if(t<=0){stop();add('chaos',10);next()}},1000))}
function promise(){shell('17/22 🤝 คำสัญญา',`<p class="story">ถ้าออมเลือกได้หนึ่งข้อ ออมอยากให้หมูสัญญาอะไร?</p>${btn('จะไม่ปล่อยให้ออมต้องง้อคนเดียว ❤️','promiseA(12,0)','pink')}${btn('จะหาเวลาให้กัน แม้จะยุ่ง','promiseA(10,1)')}${btn('จะกวนออมไปเรื่อย ๆ 😂','promiseA(4,8)')}`)}function promiseA(l,c){add('love',l);add('chaos',c);next()}
function boss(){let n=0,t=9;function h(){n++;add('love',1);document.getElementById('bn').textContent=n;if(n>=30){ach('ชนะบอส');next()}}shell('18/22 👑 บอสใหญ่: ความคิดถึง',`<p class="story">บอสมีเกราะ 30 ชั้น! แตะหัวใจให้ครบก่อนหมดเวลา</p><div class="timer" id="bt">9</div><div class="meter">💖 <span id="bn">0</span>/30</div>${btn('💗 ตีบอส!','h()','pink')}`);window.h=h;timers.push(setInterval(()=>{t--;document.getElementById('bt').textContent=t;if(t<=0){stop();add('sulk',12);next()}},1000))}
function finalChoice(){shell('19/22 💌 ก่อนจบเกม',`<p class="story">หน้าสุดท้ายแล้ว หมูถามจริง ๆ ว่า...<br><b>“ถ้าเกมนี้ไม่มีรางวัล ออมจะยังเล่นต่อไหม?”</b></p>${btn('เล่นสิ เพราะอยากอยู่กับหมู ❤️','finalA(15)','pink')}${btn('เล่น เพราะอยากเอาชนะหมู 😂','finalA(3)')}${btn('ไม่เล่นแล้ว หมูง้อก่อน 😤','finalA(-2)','danger')}`)}function finalA(v){add('love',v);if(v<0)add('sulk',10);next()}
function bonus(){let code=S.love+S.clues*10-S.sulk;let type=code>=110?'secret':S.love>=85?'sweet':S.chaos>=45?'chaos':S.sulk>=45?'sulk':'normal';S.flags.end=type;let text={secret:'🌟 SECRET ENDING — หมูเก็บความลับไว้หลายชั้น แต่สุดท้ายคำตอบง่ายมาก: หมูเลือกออม ❤️',sweet:'💗 SWEET ENDING — ออมชนะทุกเกม เพราะคนที่หมูอยากให้ชนะตั้งแต่แรกคือออม',chaos:'😂 CHAOS ENDING — สองคนไม่ได้เล่นเกมเพื่อชนะ แต่เล่นเพื่อหาเรื่องแกล้งกัน',sulk:'😤 งอน ENDING — เกมจบได้ แต่หมูยังมีงานต้องง้ออีกเยอะ',normal:'💕 ENDING — เกมจบแล้ว แต่เรื่องของเรายังไปต่อ'}[type];shell('20/22 🏁 ผลการผจญภัย',`<div class="big">${type==='secret'?'🔐💗':type==='sweet'?'💗':type==='chaos'?'😂':type==='sulk'?'😤':'💕'}</div><p class="story">${text}</p><p>🏅 ความสำเร็จ ${S.ach.length} อย่าง · 🔎 เบาะแส ${S.clues}</p>${S.ach.map(x=>`<span class="badge">🏅 ${esc(x)}</span>`).join('')}${btn('ดูข้อความสุดท้าย','next()','pink')}`)}
function ending(){shell('21/22 💌 ข้อความจากหมู',`<div class="big">🐷❤️💗</div><p class="story">ออมเล่นมาถึงตรงนี้แล้ว<br><br>จริง ๆ หมูไม่ได้อยากให้ออมเก่งทุกเกมหรอก<br><b>หมูแค่อยากหาเหตุผลให้ออมยิ้ม แล้วก็ได้ใช้เวลาอยู่ด้วยกันนาน ๆ</b><br><br>ถ้าออมอ่านถึงตรงนี้...<br>หมูรักออมนะ ❤️</p>${btn('เล่นอีกรอบ 🔄','location.reload()','pink')}<p class="small">ปลดล็อกเบาะแสได้มากขึ้นเพื่อไล่หา Secret Ending</p>`)}
render();
</script></body></html>
